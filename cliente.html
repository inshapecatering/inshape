            setMessage({ text, error: true, showSupport, wa: showSupport ? waLink(branding, `Hola, soy ${client.name}. Necesito ayuda con mi cuenta.`) : '' });
        }
        async function handlePause(mode, returnDateInput) {
            const now = new Date();
            if (now.getHours() >= 22) {
                setMessage({ text: 'Ya pasó el horario de pausa automática. Ponte en contacto con Atención al Cliente.', error: true, showSupport: true, wa: waLink(branding, `Hola, soy ${client.name}. Necesito solicitar una pausa de mi servicio.`) });
                return;
            }
            if (mode === 'scheduled' && !returnDateInput) {
                setMessage({ text: 'Selecciona una fecha de retorno para esta opción.', error: true });
                return;
            }
            const returnDate = mode === 'tomorrow' ? nextWorkDay(data, next) : mode === 'scheduled' ? returnDateInput : '';
            if (returnDate && returnDate <= next) {
                setMessage({ text: 'La fecha de retorno debe ser posterior al día pausado.', error: true });
                return;
            }
            const updated = { ...client, pauseStart: next, returnDate, status: returnDate ? 'Programado' : 'Pausado', pauseDates: (client.pauseDates || []).filter(d => d !== next) };
            const saved = await onSaveClient(updated);
            if (!saved) {
                setMessage({ text: 'No se pudo guardar la pausa en la base de datos. Intenta nuevamente.', error: true });
                return;
            }
            window.SupabaseDB?.dbInsertAudit({ actor_id: client.id, actor_name: client.name, actor_role: 'cliente', action: 'Cliente pausó su servicio (autoservicio)', entity_type: 'client', entity_label: client.name, entity_id: client.id, details: { desde: next, retorno: returnDate || 'sin definir', modo: mode } });
            setMessage({
                text: mode === 'tomorrow' ? `Pausa de un solo día (${fmt(next)}). Se reactiva sola el ${fmt(returnDate)}.`
                    : returnDate ? `Pausa programada desde el ${fmt(next)} hasta el ${fmt(returnDate)}.`
                        : `Pausa abierta desde el ${fmt(next)} sin fecha de retorno.`,
                error: false
            });
        }
        async function handleResume(byDate, resumeDateInput) {
            const now = new Date();
            if (now.getHours() >= 22) {
                setMessage({ text: 'Ya pasó el horario de reactivación automática. Ponte en contacto con Atención al Cliente.', error: true, showSupport: true, wa: waLink(branding, `Hola, soy ${client.name}. Necesito reactivar mi servicio.`) });
                return;
            }
            const target = byDate ? resumeDateInput : next;
            if (byDate && !target) {
                setMessage({ text: 'Selecciona una fecha de reactivación.', error: true });
                return;
            }
            if (target < next) {
                setMessage({ text: 'La fecha de reactivación debe ser el siguiente día laborable o una posterior.', error: true });
                return;
            }
            const updated = { ...client, returnDate: target, status: 'Programado' };
            const saved = await onSaveClient(updated);
            if (!saved) {
                setMessage({ text: 'No se pudo guardar la reactivación en la base de datos. Intenta nuevamente.', error: true });
                return;
            }
            window.SupabaseDB?.dbInsertAudit({ actor_id: client.id, actor_name: client.name, actor_role: 'cliente', action: 'Cliente reactivó su servicio (autoservicio)', entity_type: 'client', entity_label: client.name, entity_id: client.id, details: { reactivaDesde: target } });
            setMessage({ text: `Reactivación programada para el ${fmt(target)}.`, error: false });
        }
        async function handleAddressOverride(selectedAddressId) {
            const now = new Date();
            if (now.getHours() >= 22)
                return { error: true, text: 'Ya pasó el horario para cambiar la dirección de mañana. Ponte en contacto con Atención al Cliente.' };
            const result = await window.SupabaseDB?.rpc('set_client_address_override', { p_token: window.SupabaseDB?.getSessionToken(), p_client_id: client.id, p_address_id: selectedAddressId, p_date: next });
            if (!result)
                return { error: true, text: 'No se pudo guardar. Intenta nuevamente o contáctanos por WhatsApp.' };
            const overrides = Array.isArray(result) ? result : (client.addressOverrides || []).filter(o => o.date !== next).concat([{ date: next, addressId: selectedAddressId }]);
            const updated = { ...client, addressOverrides: overrides };
            localStorage.setItem(CLIENT_ROW_KEY, JSON.stringify(updated));
            onSaveClient(updated, true); 
            window.SupabaseDB?.dbInsertAudit({ actor_id: client.id, actor_name: client.name, actor_role: 'cliente', action: 'Cliente cambió su dirección de entrega (autoservicio)', entity_type: 'client', entity_label: client.name, entity_id: client.id, details: { fecha: next, addressId: selectedAddressId } });
            return { error: false, text: 'Guardado. Se usará esa dirección para el pedido de mañana.' };
        }
        return (React.createElement(React.Fragment, null,
            React.createElement(LogoutButton, null),
            React.createElement(Header, { branding: branding, theme: theme, onThemeChange: onThemeChange, showThemeSelect: true }),
            React.createElement(Hero, { client: client }),
            React.createElement(AdBanner, { branding: branding }),
            React.createElement(RenewalBanner, { data: data, client: client, branding: branding, plan: plan, state: state, remaining: remaining, onOpenPlanChange: () => setShowPlanChange(true) }),
            React.createElement("section", { className: "row g-3" },
                React.createElement(PlanCard, { client: client, branding: branding, plan: plan, state: state, remaining: remaining, included: included }),
                React.createElement(PlanChangeButton, { onOpen: () => setShowPlanChange(true) }),
                React.createElement(SupportCard, { client: client, branding: branding }),
                React.createElement("div", { className: "col-12" }, state === 'Pausado'
                    ? (client.returnDate && client.returnDate > date
                        ? React.createElement(ScheduledResumeCard, { client: client, next: next, message: message, onAdvance: () => handleResume(false) })
                        : React.createElement(ResumeForm, { next: next, message: message, onConfirm: handleResume }))
                    : React.createElement(PauseForm, { next: next, message: message, onConfirm: handlePause })),
                React.createElement(AddressCard, { client: client, data: data, branding: branding, onSaveClient: onSaveClient, onSaveTomorrowOverride: handleAddressOverride }),
                React.createElement(NoteCard, { client: client }),
                React.createElement(InstagramLink, { branding: branding })),
            React.createElement(PlanChangeModal, { show: showPlanChange, onClose: () => setShowPlanChange(false), data: data, client: client, branding: branding, plan: plan })));
    }
    function App() {
        const [phase, setPhase] = useState('checking'); 
        const [data, setData] = useState(null);
        const [client, setClient] = useState(null);
        const [branding, setBranding] = useState(() => readCachedBranding());
        const [theme, setTheme] = useState('light');
        const sessionRef = useRef(null);
        const bootedRef = useRef(false);
        useEffect(() => {
            if (bootedRef.current)
                return;
            bootedRef.current = true;
            (async () => {
                let localData, session;
                try {
                    localData = JSON.parse(localStorage.getItem(OPERATIONS_KEY)) || {};
                    session = JSON.parse(sessionStorage.getItem(CLIENT_SESSION_KEY));
                }
                catch (_) {
                    localData = {};
                    session = null;
                }
                if (!session) {
                    window.location.replace('./index.html');
                    return;
                }
                sessionRef.current = session;
                window.SupabaseDB?.setSessionToken(session.sessionToken || null, 'cliente');
                localData.days || (localData.days = {});
                let localClient = null;
                try {
                    localClient = JSON.parse(localStorage.getItem(CLIENT_ROW_KEY));
                }
                catch (_) { }
                const needsClientFetch = !localClient || localClient.id !== session.id;
              
                const [fetchedClient, freshBranding, isPremium] = await Promise.all([
                    needsClientFetch ? window.SupabaseDB?.dbGetClientRow(session.id) : Promise.resolve(localClient),
                    fetchBrandingRemote(),
                    fetchIsPremium()
                ]);
                if (needsClientFetch) {
                    if (!fetchedClient) {
                        window.location.replace('./index.html');
                        return;
                    }
                    localClient = fetchedClient;
                    localStorage.setItem(CLIENT_ROW_KEY, JSON.stringify(localClient));
                }
                setData(localData);
                setClient(localClient);
                setTheme(getClientTheme(session.id));
                if (freshBranding)
                    setBranding(freshBranding);
                if (!isPremium) {
                    setPhase('locked');
                    return;
                }
                setPhase('portal');
                window.SupabaseDB?.joinPresence({ id: localClient.id, role: 'cliente', name: localClient.name });
               
                const [{ remoteMeta, remoteClient }, freshBranding2] = await Promise.all([
                    fetchServerSync(session.id),
                    fetchBrandingRemote()
                ]);
                if (remoteMeta) {
                    const merged = { ...localData, plans: remoteMeta.plans ?? localData.plans, days: remoteMeta.days ?? localData.days, currentDate: remoteMeta.currentDate ?? localData.currentDate };
                    localStorage.setItem(OPERATIONS_KEY, JSON.stringify(merged));
                    localData = merged;
                    setData(merged);
                }
                if (remoteClient) {
                    localStorage.setItem(CLIENT_ROW_KEY, JSON.stringify(remoteClient));
                    localClient = remoteClient;
                    setClient(remoteClient);
                }
                if (freshBranding2)
                    setBranding(freshBranding2);
                if (!(await fetchIsPremium())) {
                    setPhase('locked');
                    return;
                }
                setPhase('portal');
            })();
        }, []);
        useEffect(() => {
            if (phase === 'locked') {
                document.documentElement.dataset.bsTheme = 'light';
                document.documentElement.dataset.theme = 'light';
            }
            else if (phase === 'portal') {
                document.documentElement.dataset.bsTheme = theme === 'night' ? 'dark' : 'light';
                document.documentElement.dataset.theme = theme;
            }
        }, [phase, theme]);
        function handleThemeChange(newTheme) {
            if (sessionRef.current)
                saveClientTheme(sessionRef.current.id, newTheme);
            setTheme(newTheme);
        }
      
        async function handleSaveClient(updated, onLocalUpdateOnly) {
            if (onLocalUpdateOnly) {
                setClient(updated);
                return true;
            }
            const saved = await saveClient(updated);
            if (saved)
                setClient(updated);
            return saved;
        }
        if (phase === 'checking') {
            return React.createElement("p", { className: "text-secondary text-center py-5" }, "Cargando tu portal\u2026");
        }
        if (phase === 'locked') {
            return React.createElement(PremiumLock, { branding: branding });
        }
        return React.createElement(Portal, { data: data, client: client, branding: branding, theme: theme, onThemeChange: handleThemeChange, onSaveClient: handleSaveClient });
    }
    ReactDOM.createRoot(document.getElementById('portal-root')).render(React.createElement(App, null));
} 
if (window.APP_CONFIG && window.SupabaseDB && window.React && window.ReactDOM) {
    boot();
}
else {
    const waitForDeps = setInterval(() => {
        if (window.APP_CONFIG && window.SupabaseDB && window.React && window.ReactDOM) {
            clearInterval(waitForDeps);
            boot();
        }
    }, 20);
}
  </script>
