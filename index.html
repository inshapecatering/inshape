  <style>

    html { font-size:15px; }
    :root {
      --brand:#3867f4;
      --font:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
      --font-display:Figtree,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;

    body { min-height:100vh; font-family:var(--font); background:radial-gradient(circle at 20% 20%,rgba(56,103,244,.2),transparent 34%),#f5f7fb; }
    #brand-title, .btn, .nav-pills .nav-link { font-family:var(--font-display); }
    .btn-primary {
      --bs-btn-bg: var(--brand);
      --bs-btn-border-color: var(--brand);
      --bs-btn-hover-bg: var(--brand);
      --bs-btn-hover-border-color: var(--brand);
      --bs-btn-active-bg: var(--brand);
      --bs-btn-active-border-color: var(--brand);
      --bs-btn-disabled-bg: var(--brand);
      --bs-btn-disabled-border-color: var(--brand);
      filter: brightness(1);
      transition: filter .15s, transform .15s ease, box-shadow .15s ease;
    }
    .btn-primary:hover, .btn-primary:active { filter: brightness(.92); }
    .btn-primary, #whatsapp-support-btn {
      border-radius: 999px;
      box-shadow: 0 4px 14px color-mix(in srgb, var(--brand) 35%, transparent);

    .btn-primary:hover, #whatsapp-support-btn:hover {
      transform: translateY(-2px);

    .btn-primary:active { transform: translateY(0) scale(.98); }
    #whatsapp-support-btn { transition: transform .15s ease, box-shadow .15s ease, background .15s ease; }
    .nav-pills .nav-link { border-radius: 999px; }

    [data-theme="night"] .bg-body-tertiary { background:#121824!important; }
    [data-theme="forest"] { --brand:#1f7a4d; }

    [data-theme="forest"] .bg-body-tertiary { background:#cde6cd!important; }
    #whatsapp-support-btn:hover { background:#20bd5a!important; color:#fff; }

    /* Footer legal: a propósito FUERA del árbol de React (todo lo de
       arriba se arma con React.createElement a mano, sin JSX ni build —
       tocar esto acá es más simple y no depende de que React/Supabase
       carguen). Siempre muestra el nombre del SOFTWARE (Catering
       Control), nunca el de la empresa que lo usa (ese es el que trae
       config.js vía APP_CONFIG.companyName, y varía por cliente) — para
       eso están brand-row/brand-info más arriba en la tarjeta de login. */
    .app-footer { margin-top: 28px; padding-top: 18px; border-top: 1px solid rgba(0,0,0,.08); text-align: center; }
    [data-theme="night"] .app-footer { border-top-color: rgba(255,255,255,.1); }

        </footer>

  <script>
function boot() {
    const { useState, useEffect, useRef, useCallback } = React;
    const APP_CONFIG = window.APP_CONFIG;
    const BRANDING_CACHE_KEY = `${APP_CONFIG.storagePrefix}-branding-cache-v1`;
    const STAFF_SESSION_KEY = `${APP_CONFIG.storagePrefix}-staff-session-v1`;
    const CLIENT_SESSION_KEY = `${APP_CONFIG.storagePrefix}-client-session-v1`;

    const STAFF_APP_URL = './panel.html';
    const CLIENT_PORTAL_URL = './cliente.html';

    function staffDestination(role) { return STAFF_APP_URL; }
    function readCachedBranding() {
        try {
            return JSON.parse(localStorage.getItem(BRANDING_CACHE_KEY)) || null;
        }
        catch (_) {
            return null;
        }
    }
    // ---------- Logo / nombre de la empresa (con caché) ----------
    function BrandMark({ logo, name }) {
        const [broken, setBroken] = useState(false);
        if (logo && !broken) {
            return React.createElement("img", { src: logo, alt: name, onError: () => setBroken(true) });
        }
        return React.createElement(React.Fragment, null, "\uD83C\uDF7D");
    }

            React.createElement("label", { className: "form-label small text-secondary mb-0", htmlFor: "theme-select" }, "Tema"),

    // (un cliente nuevo, un driver nuevo, etc.). Si se abre en una pestaña
    // normal del navegador, ya tienen la barra de arriba: no lo mostramos
    // para no ensuciar la pantalla con un botón redundante.
    function isStandalonePwa() {
        return window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
    }

        React.createElement("circle", { cx: "18", cy: "5", r: "3" }),
        React.createElement("circle", { cx: "6", cy: "12", r: "3" }),
        React.createElement("circle", { cx: "18", cy: "19", r: "3" }),
        React.createElement("line", { x1: "8.6", y1: "10.6", x2: "15.4", y2: "6.4" }),
        React.createElement("line", { x1: "8.6", y1: "13.4", x2: "15.4", y2: "17.6" }));
    const ICON_CHECK = React.createElement("svg", { width: "17", height: "17", viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", strokeWidth: "2.4", strokeLinecap: "round", strokeLinejoin: "round" },
        React.createElement("path", { d: "M20 6 9 17l-5-5" }));
    function ShareAppButton({ brandName }) {
        const [copied, setCopied] = useState(false);
        if (!isStandalonePwa())
            return null;
        const shareUrl = `${location.origin}${location.pathname}`;
        async function handleShare() {
            const shareData = { title: brandName, text: `Ingresá a ${brandName}`, url: shareUrl };
            if (navigator.share) {
                try {
                    await navigator.share(shareData);
                    return;
                }
                catch (_) {
                    return;
                } // el usuario canceló el panel de compartir: no hacemos nada más
            }
            try {
                await navigator.clipboard.writeText(shareUrl);
                setCopied(true);
                setTimeout(() => setCopied(false), 2000);
            }
            catch (_) { }
        }
        return (React.createElement("button", { type: "button", className: "btn btn-outline-secondary btn-sm rounded-circle d-inline-flex align-items-center justify-content-center flex-shrink-0", style: { width: 36, height: 36 }, onClick: handleShare, title: copied ? 'Link copiado' : 'Compartir esta app', "aria-label": copied ? 'Link copiado' : 'Compartir esta app' }, copied ? ICON_CHECK : ICON_SHARE));
    }
    // ---------- Formulario "Soy cliente" ----------
    function ClientForm({ active, onError, onClearError }) {
        const [carnet, setCarnet] = useState('');
        const [phone, setPhone] = useState('');
        const [loading, setLoading] = useState(false);
        async function handleSubmit(e) {
            e.preventDefault();
            onClearError();
            setLoading(true);
            try {
                const cleanCarnet = carnet.trim();
                const cleanPhone = phone.replace(/\D/g, '');
                const rows = await window.SupabaseDB?.rpc('login_cliente', { p_carnet: cleanCarnet, p_phone: cleanPhone });
                const client = Array.isArray(rows) ? rows[0] : null;
                if (!client) {
                    onError('Carnet o teléfono no coinciden con un cliente registrado.');
                    return;
                }
                sessionStorage.setItem(CLIENT_SESSION_KEY, JSON.stringify({ id: client.id, name: client.name, sessionToken: client.session_token }));
                window.SupabaseDB?.setSessionToken(client.session_token, 'cliente');
                window.location.href = CLIENT_PORTAL_URL;
            }
            catch (_) {
                onError('No se pudo conectar. Revisa tu internet e intenta de nuevo.');
            }
            finally {
                setLoading(false);
            }
        }
        return (React.createElement("form", { className: `form-panel${active ? ' active' : ''}`, onSubmit: handleSubmit },
            React.createElement("div", { className: "mb-3" },
                React.createElement("label", { className: "form-label", htmlFor: "client-carnet" }, "Carnet de identidad"),
                React.createElement("input", { className: "form-control", id: "client-carnet", autoComplete: "username", placeholder: "Ej. 12345678", required: true, value: carnet, onChange: e => setCarnet(e.target.value) })),
            React.createElement("div", { className: "mb-3" },
                React.createElement("label", { className: "form-label", htmlFor: "client-phone" }, "Tel\u00E9fono"),
                React.createElement("input", { className: "form-control", id: "client-phone", inputMode: "tel", autoComplete: "current-password", placeholder: "70000000", required: true, value: phone, onChange: e => setPhone(e.target.value) })),
            React.createElement("button", { className: "btn btn-primary w-100", type: "submit", disabled: loading }, loading ? 'Entrando…' : 'Entrar a mi plan')));
    }
    // ---------- Formulario "Soy del equipo" ----------
    function StaffForm({ active, onError, onClearError }) {
        const [email, setEmail] = useState('');
        const [password, setPassword] = useState('');
        const [showPassword, setShowPassword] = useState(false);
        const [loading, setLoading] = useState(false);
        async function handleSubmit(e) {
            e.preventDefault();
            onClearError();
            setLoading(true);
            try {
                const cleanEmail = email.trim();
                const rows = await window.SupabaseDB?.rpc('login_staff', { p_email: cleanEmail, p_password: password });
                const person = Array.isArray(rows) ? rows[0] : null;
                if (person?.locked_seconds > 0) {
                    onError(`Demasiados intentos fallidos. Espera ${person.locked_seconds} segundos e intenta de nuevo.`);
                    return;
                }
            
                const validPerson = person && typeof person.id === 'string' && person.id.trim() && typeof person.role === 'string' && person.role.trim() && typeof person.session_token === 'string' && person.session_token.trim();
                if (!validPerson) {
                    onError('Correo o contraseña incorrectos.');
                    return;
                }
                sessionStorage.setItem(STAFF_SESSION_KEY, JSON.stringify({
                    id: person.id, name: person.name, role: person.role,
                    routeId: person.routeId || '', driverId: person.driverId || '',
                    sessionToken: person.session_token
                }));
                window.SupabaseDB?.setSessionToken(person.session_token, 'staff');
                window.location.href = staffDestination(person.role);
            }
            catch (_) {
                onError('No se pudo conectar. Revisa tu internet e intenta de nuevo.');
            }
            finally {
                setLoading(false);
            }
        }
        return (React.createElement("form", { className: `form-panel${active ? ' active' : ''}`, onSubmit: handleSubmit },
            React.createElement("div", { className: "mb-3" },
                React.createElement("label", { className: "form-label", htmlFor: "staff-email" }, "Correo"),
                React.createElement("input", { className: "form-control", id: "staff-email", type: "email", autoComplete: "username", required: true, value: email, onChange: e => setEmail(e.target.value) })),
            React.createElement("div", { className: "mb-3" },
                React.createElement("label", { className: "form-label", htmlFor: "staff-pass" }, "Contrase\u00F1a"),
                React.createElement("div", { className: "input-group" },
                    React.createElement("input", { className: "form-control", id: "staff-pass", type: showPassword ? 'text' : 'password', autoComplete: "current-password", required: true, value: password, onChange: e => setPassword(e.target.value) }),
                    React.createElement("button", { className: "btn btn-outline-secondary", type: "button", "aria-label": showPassword ? 'Ocultar contraseña' : 'Mostrar contraseña', onClick: () => setShowPassword(v => !v) }, showPassword ? '😆' : '😃'))),
            React.createElement("button", { className: "btn btn-primary w-100", type: "submit", disabled: loading }, loading ? 'Entrando…' : 'Entrar al panel')));
    }
    // ---------- App principal ----------
    function App() {
        const cached = readCachedBranding();
        const [theme, setTheme] = useState(() => localStorage.getItem(UI_THEME_KEY) || 'light');
        const [accessType, setAccessType] = useState('client');
        const [errorMsg, setErrorMsg] = useState('');
        const [brandName, setBrandName] = useState(cached?.name || APP_CONFIG.companyName);
        const [brandLogo, setBrandLogo] = useState(cached?.logo || APP_CONFIG.logoUrl || '');
        const [whatsappNumber, setWhatsappNumber] = useState(cached?.whatsappNumber || APP_CONFIG.whatsappNumber || '');
        const redirected = useRef(false);
     
        useEffect(() => {
            document.documentElement.dataset.theme = theme;
            localStorage.setItem(UI_THEME_KEY, theme);
        }, [theme]);
        // Título de la pestaña.
        useEffect(() => {
            document.title = `${brandName} · Iniciar sesión`;
        }, [brandName]);
     
        useEffect(() => {
            if (redirected.current)
                return;
            try {
                const existingStaff = JSON.parse(sessionStorage.getItem(STAFF_SESSION_KEY));
                if (existingStaff) {
                    redirected.current = true;
                    window.location.href = staffDestination(existingStaff.role);
                    return;
                }
                // Mismo chequeo que ya existía para staff, pero para cliente --
                // antes esta rama no existía, así que un cliente que ya había
                // iniciado sesión (con la pestaña/PWA todavía viva) igual veía
                // el formulario de login en vez de ir directo a su portal.
                const existingClient = JSON.parse(sessionStorage.getItem(CLIENT_SESSION_KEY));
                if (existingClient) {
                    redirected.current = true;
                    window.location.href = CLIENT_PORTAL_URL;
                }
            }
            catch (_) { }
        }, []);
   
        useEffect(() => {
            let cancelled = false;
            (async () => {
                let settings = null;
                try {
                    settings = await window.SupabaseDB?.rpc('get_branding', {});
                }
                catch (_) { }
                if (cancelled || !settings)
                    return;
                const name = settings.companyName?.trim() || APP_CONFIG.companyName;
                const logo = settings.logoUrl || APP_CONFIG.logoUrl || '';
                const whatsapp = settings.whatsappNumber || '';
                setBrandName(name);
                setBrandLogo(logo);
                if (whatsapp)
                    setWhatsappNumber(whatsapp);
                try {
                    localStorage.setItem(BRANDING_CACHE_KEY, JSON.stringify({ name, logo, whatsappNumber: whatsapp }));
                }

            React.createElement("div", { className: "card-body p-4 p-md-5" },
                React.createElement("div", { className: "brand-row mb-4" },
                    React.createElement("div", { className: "brand-mark d-inline-flex align-items-center justify-content-center fs-2", id: "brand-mark" },
                        React.createElement(BrandMark, { logo: brandLogo, name: brandName })),

                        React.createElement(ThemeSelect, { theme: theme, onChange: setTheme })),
                    React.createElement(ShareAppButton, { brandName: brandName })),
                React.createElement("nav", { className: "nav nav-pills nav-fill bg-body-tertiary rounded-pill p-1 mb-4", "aria-label": "Tipo de acceso" },
                    React.createElement("button", { type: "button", className: `nav-link${accessType === 'client' ? ' active' : ''}`, onClick: () => { setAccessType('client'); setErrorMsg(''); } }, "Soy cliente"),
                    React.createElement("button", { type: "button", className: `nav-link${accessType === 'staff' ? ' active' : ''}`, onClick: () => { setAccessType('staff'); setErrorMsg(''); } }, "Soy del equipo")),
                React.createElement(ClientForm, { active: accessType === 'client', onError: setErrorMsg, onClearError: () => setErrorMsg('') }),
                React.createElement(StaffForm, { active: accessType === 'staff', onError: setErrorMsg, onClearError: () => setErrorMsg('') }),
                errorMsg && React.createElement("div", { className: "alert alert-danger mt-3 mb-0", role: "alert" }, errorMsg),
