<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Catering Control · Operaciones</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <script src="./config.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" crossorigin defer></script>
  <script src="./app.js" defer></script>
  <style>
    :root {
      --bg: #f5f7fb;
      --surface: #ffffff;
      --surface-2: #f0f4fa;
      --text: #172033;
      --muted: #657188;
      --line: #dbe2ee;
      --primary: #3867f4;
      --primary-ink: #fff;
      --primary-solid: var(--primary);
      --accent: #15a77f;
      --danger: #e4002b;
      --warning: #f4a940;
      --shadow: 0 14px 36px rgba(21,35,62,.10);
      --radius: 12px;
      --radius-sm: 8px;
      --radius-lg: 16px;
      /* Escala tipografica: usar estos tokens en vez de tamanos sueltos (11px, 13px, 17px...) */
      --fs-xs: 11px;
      --fs-sm: 12px;
      --fs-base: 14px;
      --fs-md: 16px;
      --fs-lg: 20px;
      --fs-xl: 25px;
      --font: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      --font-display: Figtree, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      color-scheme: light;
      --bs-body-color: var(--text);
      --bs-body-bg: var(--bg);
      --bs-border-color: var(--line);
      --bs-secondary-color: var(--muted);
      --bs-emphasis-color: var(--text);
      --bs-heading-color: var(--text);
      --bs-link-color: var(--primary);
      --bs-tertiary-bg: var(--surface-2);
    }
    [data-theme="night"] {
      --bg: #121824;
      --surface: #1b2433;
      --surface-2: #222e40;
      --text: #edf2fa;
      --muted: #a9b6c9;
      --line: #324158;
      --primary: #7296ff;
      --primary-ink: #0f1726;
      --primary-solid: #3867f4;
      --accent: #51cfaa;
      --danger: #ff4d4d;
      --warning: #ffc466;
      --shadow: 0 14px 36px rgba(0,0,0,.3);
      color-scheme: dark;
    }
    [data-theme="forest"] {
      --bg: #dcefdc;
      --surface: #f2faf1;
      --surface-2: #cde6cd;
      --text: #163821;
      --muted: #4f7259;
      --line: #a9d2ab;
      color-scheme: light;
      --primary: #1f7a4d;
      --primary-ink: #fff;
      --accent: #9c5f20;
      --danger: #b3001f;
      --warning: #bd7b1d;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { overflow-x: hidden; max-width: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: var(--fs-base)/1.35 var(--font);
      transition: background .2s, color .2s;
    }
    button, input, select, textarea { font: inherit; }
    button {
      border: 0;
      cursor: pointer;
      border-radius: 999px;
      padding: 9px 18px;
      font-family: var(--font-display);
      font-weight: 650;
      color: var(--text);
      background: var(--surface-2);
      min-height: 36px;
      box-shadow: 0 2px 8px rgba(0,0,0,.07);
      transition: background .15s, transform .12s ease, box-shadow .15s ease, filter .15s ease;
    }
    button:hover { filter: brightness(.97); transform: translateY(-2px); box-shadow: 0 6px 16px rgba(0,0,0,.13); }
    button:active { transform: translateY(0); box-shadow: 0 2px 8px rgba(0,0,0,.08); }
    button.primary, button.refresh {
      background: linear-gradient(135deg, color-mix(in srgb, var(--primary-solid) 78%, white 22%), var(--primary-solid));
      color: #fff;
      box-shadow: 0 4px 14px color-mix(in srgb, var(--primary-solid) 38%, transparent);
    }
    button.primary:hover, button.refresh:hover { box-shadow: 0 8px 22px color-mix(in srgb, var(--primary-solid) 42%, transparent); }
    button.danger {
      background: linear-gradient(135deg, color-mix(in srgb, var(--danger) 78%, white 22%), var(--danger));
      color: #fff;
      box-shadow: 0 4px 14px color-mix(in srgb, var(--danger) 38%, transparent);
    }
    button.danger:hover { box-shadow: 0 8px 22px color-mix(in srgb, var(--danger) 42%, transparent); }
    button.outline {
      background: transparent;
      border: 1px solid var(--line);
      box-shadow: none;
    }
    button.outline:hover { background: var(--surface-2); box-shadow: none; }
    button.success {
      background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 78%, white 22%), var(--accent));
      color: #fff;
      box-shadow: 0 4px 14px color-mix(in srgb, var(--accent) 38%, transparent);
    }
    button.success:hover { box-shadow: 0 8px 22px color-mix(in srgb, var(--accent) 42%, transparent); }
    button.warning {
      background: linear-gradient(135deg, color-mix(in srgb, var(--warning) 78%, white 22%), var(--warning));
      color: #fff;
      box-shadow: 0 4px 14px color-mix(in srgb, var(--warning) 38%, transparent);
    }
    button.warning:hover { box-shadow: 0 8px 22px color-mix(in srgb, var(--warning) 42%, transparent); }
    button.info {
      background: linear-gradient(135deg, color-mix(in srgb, #0ea5b7 78%, white 22%), #0ea5b7);
      color: #fff;
      box-shadow: 0 4px 14px color-mix(in srgb, #0ea5b7 38%, transparent);
    }
    button.info:hover { box-shadow: 0 8px 22px color-mix(in srgb, #0ea5b7 42%, transparent); }
    button.excel {
      background: linear-gradient(135deg, color-mix(in srgb, #217346 78%, white 22%), #217346);
      color: #fff;
      box-shadow: 0 4px 14px color-mix(in srgb, #217346 38%, transparent);
    }
    button.excel:hover { box-shadow: 0 8px 22px color-mix(in srgb, #217346 42%, transparent); }
    button:disabled {
      cursor: not-allowed;
      opacity: .52;
      transform: none !important;
      box-shadow: none !important;
    }
    input, select, textarea {
      width: 100%;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      padding: 8px 10px;
      outline: none;
      min-height: 36px;
      transition: border-color .15s, box-shadow .15s;
    }
    /* Safari/iOS le da a los campos de fecha (y mes/hora) un ancho minimo
       de contenido que ignora el "width:100%" de arriba en cuanto el input
       vive dentro de un grid o flex (como los <label> de .form-grid): el
       campo se desborda de su recuadro en vez de encogerse. Con
       min-width:0 se deja que el ancho real lo defina el contenedor. */
    input[type="date"], input[type="month"], input[type="time"], input[type="datetime-local"] {
      min-width: 0;
    }
    input[type="checkbox"], input[type="radio"] {
      width: auto;
      min-height: auto;
      min-width: auto;
      padding: 0;
      border: 1px solid var(--line);
      accent-color: var(--primary);
      flex: 0 0 auto;
      vertical-align: -2px;
    }
    select option { color: var(--text); background: var(--surface); }
    input:focus, select:focus, textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 16%, transparent);
    }
    textarea { resize: vertical; min-height: 70px; }

    #login {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--bg);
    }
    .login-card {
      width: min(440px, 100%);
      padding: 28px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }
    .brand {
      display: flex;
      gap: 11px;
      align-items: center;
    }
    .brand-mark {
      background: var(--primary);
      color: var(--primary-ink);
      font-size: 22px;
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border-radius: var(--radius);
      overflow: hidden;
    }
    .brand-mark img { width: 100%; height: 100%; object-fit: contain; background: #fff; }
    .brand strong, .profile b { font-family: var(--font-display); }
    h1, h2, h3, p { margin-top: 0; }
    h1, h2, h3 { font-family: var(--font-display); font-weight: 700; }
    h1 { font-size: var(--fs-xl); }
    h2 { font-size: var(--fs-lg); }
    h3 { font-size: var(--fs-md); }
    .muted { color: var(--muted); }
    .stack { display: grid; gap: 12px; }
    .plan-options { display: grid; gap: 10px; }
    .plan-option {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      padding: 12px 14px;
      border-radius: var(--radius-sm);
      border: 1.5px solid var(--line);
      transition: border-color .15s, background .15s;
    }
    .plan-option-info { display: flex; flex-direction: column; gap: 2px; }
    .plan-option-actions { display: flex; align-items: center; gap: 8px; flex-wrap: nowrap; }
    .plan-option.is-active {
      border-color: var(--primary);
      background: color-mix(in srgb, var(--primary) 9%, transparent);
    }
    .plan-option.is-alt {
      border-color: var(--danger);
      background: color-mix(in srgb, var(--danger) 6%, transparent);
    }
    label { display: grid; gap: 5px; font-weight: 650; font-size: var(--fs-sm); min-width: 0; }

    #app {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 240px 1fr;
    }
    aside {
      position: sticky;
      top: 0;
      height: 100vh;
      overflow: auto;
      padding: 18px 12px 130px;
      background: var(--surface);
      border-right: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: background .2s;
    }
    .aside-title {
      padding: 6px 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }
    .aside-title small {
      color: var(--muted);
      display: block;
      margin: 4px 0 0 54px;
    }
    .menu-toggle {
      display: none;
      background: transparent;
      padding: 4px 8px;
      min-height: auto;
      color: var(--text);
      border: 1px solid var(--line);
      box-shadow: none;
    }
    .menu-toggle svg { display: block; }
    .collapse-toggle {
      display: block;
      background: transparent;
      border: 1px solid var(--line);
      font-size: 14px;
      font-weight: 700;
      padding: 4px 8px;
      min-height: auto;
      flex-shrink: 0;
      color: var(--muted);
    }
    nav {
      display: grid;
      gap: 4px;
    }
    nav button {
      display: flex;
      text-align: left;
      gap: 11px;
      align-items: center;
      background: transparent;
      color: var(--muted);
      border-radius: var(--radius-sm);
      padding: 10px;
      font-weight: 500;
    }
    nav button.active,
    nav button:hover {
      color: var(--primary);
      background: color-mix(in srgb, var(--primary) 10%, transparent);
    }
    .nav-icon { position: relative; width: 21px; text-align: center; font-size: 16px; }
    .nav-badge {
      position: absolute; top: -6px; right: -10px;
      min-width: 16px; height: 16px; padding: 0 4px;
      border-radius: 999px; background: #e5484d; color: #fff;
      font-size: 10px; font-weight: 800; line-height: 16px; text-align: center;
      box-shadow: 0 0 0 2px var(--surface);
    }
    #app.sidebar-collapsed .nav-badge { top: -4px; right: -6px; }
    .aside-bottom {
      margin-top: auto;
      padding: 12px 10px;
      border-top: 1px solid var(--line);
      display: grid;
      gap: 8px;
    }
    .profile {
      display: flex;
      align-items: center;
      gap: 9px;
    }
    .avatar {
      width: 31px; height: 31px; border-radius: 50%;
      display: grid; place-items: center;
      background: var(--primary);
      color: var(--primary-ink);
      font-weight: 800;
      flex-shrink: 0;
    }
    .sync-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: var(--muted);
    }
    .sync-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--muted);
      flex: 0 0 auto;
    }
    .sync-dot.ok { background: var(--accent); }
    .sync-dot.error { background: var(--danger); }
    .sync-dot.local { background: var(--warning); }
    .aside-bottom-actions {
      position: fixed;
      left: 18px;
      bottom: 18px;
      z-index: 40;
      width: 204px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-areas: "status status" "logout sync";
      gap: 8px;
      align-items: center;
      background: var(--surface);
      padding: 10px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1px solid var(--line);
    }
    #sync-pill { grid-area: status; }
    #logout-btn, #manual-sync-btn {
      grid-area: logout;
      width: 100%;
      justify-content: center;
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 8px 6px;
    }
    #manual-sync-btn { grid-area: sync; }
    .btn-text { display: inline; }

    main {
      min-width: 0;
      padding: 26px;
      background: var(--bg);
      transition: background .2s;
    }
    .page { display: none; }
    .page.active { display: block; }

    .page-head {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 18px;
      align-items: flex-start;
      margin-bottom: 20px;
    }
    .page-head h1 { font-size: var(--fs-xl); margin: 0 0 5px; }
    .page-head p { color: var(--muted); margin: 0; }
    .head-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      flex-basis: 100%;
    }
    .head-actions:empty { display: none; }
    .toolbar {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 13px;
      padding: 11px;
      border: 1px solid var(--line);
      background: var(--surface);
      border-radius: var(--radius);
    }
    .toolbar .search { width: 230px; }
    .toolbar .field { width: 175px; }
    .toolbar .spacer { flex: 1; }
    .date-input-wrap {
      width: 100%;
      display: flex;
    }
    .date-input-wrap input[type="date"], .date-input-wrap input[type="month"] {
      flex: 1 1 0;
      width: 0;
      min-width: 0;
    }

    .card {
      border: 1px solid var(--line);
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: 0 2px 5px rgba(20,35,55,.025);
      min-width: 0; /* evita que contenido interno (ej. botones/checklists
        largos dentro de .two-col) fuerce la tarjeta más ancha que su
        columna de grid y la saque de la pantalla */
    }
    .card-pad { padding: 17px; }
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(135px, 1fr));
      gap: 12px;
      margin-bottom: 18px;
    }
    .metric {
      padding: 14px;
    }
    .metric strong {
      font-size: 24px;
      display: block;
      margin-top: 4px;
    }
    .metric small { color: var(--muted); }

    .sheet {
      overflow: auto;
      max-height: calc(100vh - 244px);
      min-height: 340px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      -webkit-overflow-scrolling: touch;
    }
    table {
      border-collapse: separate;
      border-spacing: 0;
      table-layout: fixed;
    }
    .sheet table.table {
      table-layout: fixed;
      margin-bottom: 0;
    }
    .sheet table.table > :not(caption) > * > * { box-shadow: none; color: inherit; }
    .table td b, .table th b { font-family: var(--font-display); color: var(--text); font-weight: 700; }
    th, td {
      border-right: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      padding: 8px 10px;
      vertical-align: middle;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    th {
      position: sticky;
      top: 0;
      z-index: 2;
      background: var(--surface-2);
      text-align: left;
      font-size: 11px;
      letter-spacing: .02em;
      color: var(--muted);
      text-transform: uppercase;
      user-select: none;
      font-family: var(--font-display);
      font-weight: 700;
    }
    th[data-sort] { cursor: pointer; }
    th[data-sort]:hover { color: var(--primary); }
    th:last-child, td:last-child { border-right: 0; }
    tr:last-child td { border-bottom: 0; }
    .sheet table.table tbody tr:nth-child(even) td,
    #dispatch-table tbody tr:nth-child(even) td {
      background: var(--surface-2);
    }
    tbody tr:hover td {
      background: color-mix(in srgb, var(--primary) 4%, transparent);
    }
    tr.dragging td { opacity: .4; }

    .resize-handle {
      position: absolute;
      right: -3px;
      top: 0;
      width: 7px;
      height: 100%;
      cursor: col-resize;
      z-index: 4;
      touch-action: none;
    }
    th { position: sticky; }
    body.col-dragging, body.col-dragging * {
      user-select: none !important;
      -webkit-user-select: none !important;
    }
    th .resize-handle:hover { background: var(--primary); }
    .col-drag-handle {
      display: inline-block;
      margin-right: 4px;
      cursor: grab;
      color: var(--muted);
      touch-action: none;
      user-select: none;
    }
    .col-drag-handle:hover { color: var(--primary); }
    #dispatch-table thead th.drag-over { background: color-mix(in srgb, var(--primary) 18%, transparent); }

    @media (pointer: coarse) {
      .resize-handle { width: 22px; right: -11px; }
      .col-drag-handle {
        font-size: 20px;
        line-height: 1;
        padding: 10px 8px;
        margin: -10px -4px -10px -8px; /* compensa el padding para no correr el layout */
      }
      input, select, textarea { font-size: 16px; }
    }

    .editable-cell input,
    .editable-cell select {
      padding: 4px 5px;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      background: var(--surface);
      min-width: 64px;
      font-size: 12px;
    }
    @media (pointer: coarse) {
      .editable-cell input, .editable-cell select { font-size: 16px; }
    }
    .editable-cell select { width: 135px; }
    .handle {
      color: var(--muted);
      cursor: grab;
      font-size: 16px;
      text-align: center;
      width: 30px;
      position: relative;
    }
    .row-resize-handle {
      position: absolute;
      left: 0; right: 0; bottom: -3px;
      height: 7px;
      cursor: row-resize;
      z-index: 5;
    }
    .row-resize-handle:hover { background: var(--primary); opacity: .35; }
    .id-cell { color: var(--muted); font-size: 12px; }
    .actions { display: flex; gap: 5px; }
    .icon-btn {
      padding: 5px 7px;
      background: transparent;
      color: var(--primary);
      min-height: auto;
    }
    .icon-btn.delete {
      color: var(--danger);
      background: color-mix(in srgb, var(--danger) 13%, transparent);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 28px;
      height: 28px;
      padding: 0;
      font-size: 16px;
      font-weight: 800;
      line-height: 1;
    }
    .icon-btn.delete:hover { background: color-mix(in srgb, var(--danger) 24%, transparent); }
    .sort-ind {
      font-size: 9px;
      margin-left: 3px;
      opacity: .7;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      padding: 3px 8px;
      border-radius: 99px;
      font-size: 11px;
      font-weight: 750;
      white-space: nowrap;
    }
    .badge.active { color: #087354; background: #dff7ed; }
    .badge.paused { color: #8d5a02; background: #fff2d9; }
    .badge.pending { color: #7551ad; background: #eee5ff; }
    .badge.done { color: #697589; background: #e8edf4; }
    .badge.off { color: #778293; background: #edf0f5; }
    .badge.warn { color: #8d5a02; background: #fff2d9; }
    .badge.danger { color: #a3123a; background: #ffe1e6; }
    .notes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
    .note-card { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--primary); border-radius: var(--radius); padding: 14px; display: flex; flex-direction: column; gap: 8px; }
    .note-card.note-overdue { border-left-color: #e5484d; }
    .note-card-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .note-date { margin-left: auto; font-size: 12px; white-space: nowrap; }
    .note-text { margin: 0; white-space: pre-wrap; word-break: break-word; }
    .note-client { margin: 0; font-size: 12.5px; }
    .note-client-name { font-family: var(--font-display); font-weight: 700; font-size: var(--fs-base); color: var(--text); }
    .note-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
    [data-theme="night"] .badge.active { color: #8cf0ce; background: #164c3b; }
    [data-theme="night"] .badge.paused { color: #ffd58e; background: #5e4318; }
    [data-theme="night"] .badge.pending { color: #d5b9ff; background: #423061; }

  <dialog id="modal"><form method="dialog" class="app-modal" id="modal-form"><div class="app-modal-head"><h2 id="modal-title"></h2><button type="button" class="close" id="modal-close" aria-label="Cerrar">×</button></div><div class="app-modal-body" id="modal-body"></div><div class="app-modal-foot" id="modal-foot"><button type="button" id="modal-cancel" value="cancel">Cancelar</button><button class="primary" id="modal-save" value="default">Guardar</button></div></form></dialog>

  <script>
document.addEventListener('DOMContentLoaded', () => {
(() => {
      'use strict';
      const APP_CONFIG = window.APP_CONFIG;

      let excelJsLoadPromise=null;
      function ensureExcelJS(){
        if(window.ExcelJS) return Promise.resolve(true);
        if(excelJsLoadPromise) return excelJsLoadPromise;
        excelJsLoadPromise=new Promise(resolve=>{
          const script=document.createElement('script');
          script.src='https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js';
          script.onload=()=>resolve(true);
          script.onerror=()=>{ excelJsLoadPromise=null; resolve(false); };
          document.head.appendChild(script);
        });
        return excelJsLoadPromise;
      }

      let leafletLoadPromise=null;
      function ensureLeaflet(){
        if(window.L) return Promise.resolve(true);
        if(leafletLoadPromise) return leafletLoadPromise;
        leafletLoadPromise=new Promise(resolve=>{
          if(!document.getElementById('leaflet-css')){
            const link=document.createElement('link');
            link.id='leaflet-css';
            link.rel='stylesheet';
            link.href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';
            link.integrity='sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=';
            link.crossOrigin='';
            document.head.appendChild(link);
          }
          const script=document.createElement('script');
          script.src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';
          script.integrity='sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=';
          script.crossOrigin='';
          script.onload=()=>resolve(true);
          script.onerror=()=>{ leafletLoadPromise=null; resolve(false); };
          document.head.appendChild(script);
        });
        return leafletLoadPromise;
      }
      const KEY = `${APP_CONFIG.storagePrefix}-operaciones-v3`;

      const STAFF_USERS_KEY = `${APP_CONFIG.storagePrefix}-staff-users-v1`;
      const STAFF_SESSION_KEY = `${APP_CONFIG.storagePrefix}-staff-session-v1`;
      const CLIENTS_SYNC_KEY = `${APP_CONFIG.storagePrefix}-clients-sync-at-v1`;

      const UI_THEME_KEY = `${APP_CONFIG.storagePrefix}-ui-theme-v1`;
      const USER_THEME_KEY = `${APP_CONFIG.storagePrefix}-user-theme-v1`;
      const SIDEBAR_COLLAPSED_KEY = `${APP_CONFIG.storagePrefix}-sidebar-collapsed-v1`;
      const COL_PREFS_KEY = `${APP_CONFIG.storagePrefix}-col-prefs-v1`;
      const DRIVER_VIEW_DATE_KEY = `${APP_CONFIG.storagePrefix}-driver-viewdate-v1`;
      const $ = (s, root=document) => root.querySelector(s);
      function isShortMapsLink(text){ return /(?:maps\.app\.goo\.gl|goo\.gl\/maps)/i.test(text||''); }
      function srcFingerprint(addr){ return `${addr?.coords||''}|${addr?.maps||''}|${addr?.address||''}`; }
      async function resolveShortMapsLinksForClient(c){
        const db=window.SupabaseDB;
        if(!db?.client?.functions) return;
        let changed=false;
        for(const addr of (c.addresses||[])){
          if(!addr?.maps || extractLatLngFromMapsField(addr.maps) || !isShortMapsLink(addr.maps)) continue;
          try{
            const { data, error } = await db.client.functions.invoke('resolve-maps-link', { body:{ url: addr.maps } });
            if(!error && data?.lat!=null && data?.lng!=null){
              addr.lat=data.lat; addr.lng=data.lng;
              addr.coords=`${data.lat}, ${data.lng}`;
              addr.geoSrc=srcFingerprint(addr);
              changed=true;
            }
          } catch(_){ /* silencioso: no bloquea nada si falla */ }
        }
        if(changed) save();
      }
      function extractLatLngFromMapsField(text){
        if (!text) return null;
        const patterns=[
          /!3d(-?\d{1,3}\.\d+)!4d(-?\d{1,3}\.\d+)/,
          /[?&](?:q|ll|daddr)=(-?\d{1,3}\.\d+),\s*(-?\d{1,3}\.\d+)/,
          /@(-?\d{1,3}\.\d+),\s*(-?\d{1,3}\.\d+)/,
          /(-?\d{1,3}\.\d{3,}),\s*(-?\d{1,3}\.\d{3,})/
        ];
        for (const re of patterns){
          const m=String(text).match(re);
          if (m){
            const lat=parseFloat(m[1]), lng=parseFloat(m[2]);
            if (Math.abs(lat)<=90 && Math.abs(lng)<=180) return { lat, lng };
          }
        }
        return null;
      }
      function googleMapsDirectLink(value){
        const v=String(value||'').trim();
        if (!v) return '';
        if (/^https?:\/\//i.test(v)) return v;
        const coords=extractLatLngFromMapsField(v);
        if (coords) return `https://www.google.com/maps/dir/?api=1&destination=${coords.lat},${coords.lng}`;
        return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(v)}`;
      }
      function addressMapsLink(a){
        if(!a) return '';
        const coords=String(a.coords||'').trim();
        if(coords){
          const m=coords.match(/^(-?\d{1,3}(?:\.\d+)?)\s*,\s*(-?\d{1,3}(?:\.\d+)?)$/);
          if(m) return `https://www.google.com/maps/dir/?api=1&destination=${m[1]},${m[2]}`;
        }
        if(a.maps) return googleMapsDirectLink(a.maps);
        return '';
      }
      const $$ = (s, root=document) => [...root.querySelectorAll(s)];
      (() => {
        const proto = Element.prototype;
        const desc = Object.getOwnPropertyDescriptor(proto, 'innerHTML');
        Object.defineProperty(proto, 'innerHTML', { configurable: true, enumerable: true, get: desc.get, set(html) {
          if (this.classList && this.classList.contains('page')) {
            const before = $$('.sheet', this).map(el => [el.scrollLeft, el.scrollTop]);
            desc.set.call(this, html);
            $$('.sheet', this).forEach((el, i) => { const pos = before[i]; if (pos) { el.scrollLeft = pos[0]; el.scrollTop = pos[1]; } });
          } else {
            desc.set.call(this, html);
          }
        } });
      })();
      const esc = (v='') => String(v ?? '').replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#039;','"':'&quot;'}[c]));
      const n = v => Number(v) || 0;
      const uid = p => `${p}_${Date.now().toString(36)}${Math.random().toString(36).slice(2,6)}`;
      const today = () => new Date().toISOString().slice(0,10);

      const DEFAULT_MENU_ITEMS = [['shots','Shots'],['proteins','Proteínas'],['juices','Jugos'],['breakfast','Desayuno'],['snack1','Merienda 1'],['lunch','Almuerzo'],['snack2','Merienda 2'],['dinner','Cena']];

      function menuItems(){ return (state?.settings?.menuItems||[]).map(m=>[m.key,m.label]); }

      function resizeImageToBlob(file, maxDim = 480, quality = 0.82) {
        return new Promise((resolve, reject) => {
          if (!file || !file.type?.startsWith('image/')) { reject(new Error('Archivo no válido')); return; }
          const img = new Image();
          const reader = new FileReader();
          reader.onload = () => {
            img.onload = () => {
              const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
              const w = Math.max(1, Math.round(img.width * scale)), h = Math.max(1, Math.round(img.height * scale));
              const canvas = document.createElement('canvas'); canvas.width = w; canvas.height = h;
              canvas.getContext('2d').drawImage(img, 0, 0, w, h);
              canvas.toBlob(blob => blob ? resolve(blob) : reject(new Error('No se pudo comprimir la imagen')), 'image/jpeg', quality);
            };
            img.onerror = () => reject(new Error('No se pudo leer la imagen'));
            img.src = reader.result;
          };
          reader.onerror = () => reject(new Error('No se pudo leer el archivo'));
          reader.readAsDataURL(file);
        });
      }
      function storagePathFromUrl(url) {
        if (!url) return null;
        const bucket = window.SupabaseDB?.IMAGES_BUCKET || 'app-images';
        const marker = `/object/public/${bucket}/`;
        const idx = String(url).indexOf(marker);
        return idx === -1 ? null : url.slice(idx + marker.length);
      }
      function removeStorageImageByUrl(url) {
        const path = storagePathFromUrl(url);
        if (path) window.SupabaseDB?.storageRemoveImage(path);
      }
      async function uploadImageFile(file, folder, maxDim = 480, quality = 0.82, oldUrl = '') {
        const blob = await resizeImageToBlob(file, maxDim, quality);
        const path = `${folder}/${uid('img')}.jpg`;
        const url = await window.SupabaseDB?.storageUploadImage(path, blob, 'image/jpeg');
        if (!url) throw new Error('No se pudo subir la imagen a Storage.');
        if (oldUrl) removeStorageImageByUrl(oldUrl);
        return url;
      }
      function applyBranding(){
        const name = state?.settings?.companyName?.trim() || APP_CONFIG.companyName;
        const logo = state?.settings?.logoUrl || '';
        const nameEl = $('#brand-name'); if (nameEl) nameEl.textContent = name;
        const markEl = $('#brand-mark'); if (markEl) markEl.innerHTML = logo ? `<img loading="lazy" decoding="async" src="${esc(logo)}" alt="${esc(name)}">` : '🍽';
        document.title = `${name} · Operaciones`;
      }

      const defaultStaffUser = {id:'staff_admin',name:'Administrador',username:'admin',email:'admin@catering.local',role:'admin',routeId:'',driverId:''};
      function readStaffUsers(){
        try { const stored=JSON.parse(localStorage.getItem(STAFF_USERS_KEY)); if(Array.isArray(stored) && stored.length) return stored; } catch (_) {}
        localStorage.setItem(STAFF_USERS_KEY,JSON.stringify([defaultStaffUser]));
        return [defaultStaffUser];
      }

      let activeUser = null;
      let presenceCounts = {cliente:0, driver:0, staff:0, total:0};
      let presenceDetail = [];
      const ROLE_ICON = {cliente:'🧑‍🍳', driver:'🚚', staff:'🧑‍💼'};
      function computePresenceCounts(presenceState){
        const counts={cliente:0, driver:0, staff:0};
        const detail=[];
        Object.values(presenceState||{}).forEach(metas=>{
          (metas||[]).forEach(m=>{
            if(counts[m.role]!==undefined) counts[m.role]++;
            detail.push(m);
          });
        });
        detail.sort((a,b)=>(a.role||'').localeCompare(b.role||'') || String(b.at||'').localeCompare(String(a.at||'')));
        presenceDetail = detail;
        return {...counts, total:counts.cliente+counts.driver+counts.staff};
      }
      function presenceCountsHTML(){
        const c=presenceCounts;
        const item=(label,val)=>`<div class="metric" style="min-width:110px"><div class="muted" style="font-size:11px">${label}</div><strong style="font-size:22px">${val}</strong></div>`;
        return item('Clientes',c.cliente)+item('Drivers',c.driver)+item('Personal',c.staff)+item('Total',c.total);
      }
      function presenceDetailHTML(){
        if(!presenceDetail.length) return '<p class="muted" style="margin-top:8px">Nadie conectado ahora mismo.</p>';
        const row=m=>{
          const roleLabel = m.role==='cliente'?'Cliente':m.role==='driver'?'Driver':'Personal';
          const since = m.at ? new Date(m.at).toLocaleTimeString('es-BO',{hour:'2-digit',minute:'2-digit'}) : '—';
          return `<div style="display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline;padding:8px 4px;border-bottom:1px solid var(--line)">
            <span style="min-width:90px">${ROLE_ICON[m.role]||'●'} ${esc(roleLabel)}</span>
            <b style="min-width:120px">${esc(m.name||'(sin nombre)')}</b>
            ${m.id?`<small class="muted">${esc(m.id)}</small>`:''}
            <span class="muted" style="margin-left:auto">${esc(m.device||'—')} · desde ${since}</span>
          </div>`;
        };
        return `<div style="margin-top:8px;max-height:260px;overflow-y:auto">${presenceDetail.map(row).join('')}</div>`;
      }
      let staffUsers = readStaffUsers();

      function readColPrefsStore(){ try { return JSON.parse(localStorage.getItem(COL_PREFS_KEY)) || {}; } catch (_) { return {}; } }
      function writeColPrefsStore(store){ try { localStorage.setItem(COL_PREFS_KEY, JSON.stringify(store)); } catch (_) {} }
      function userColPrefs(){
        const store=readColPrefsStore(), key=activeUser?.id || 'default';
        if(!store[key]){
          store[key]={ columnWidths: state.settings.columnWidths || {}, columnOrder: { dispatch: state.settings.dispatchColumnOrder || [] }, hiddenColumns: state.settings.hiddenColumns || [] };
          writeColPrefsStore(store);
        }
        store[key].hiddenColumns ??= [];
        store[key].columnOrder ??= {};
        if(store[key].dispatchColumnOrder?.length && !store[key].columnOrder.dispatch?.length){
          store[key].columnOrder.dispatch=store[key].dispatchColumnOrder;
        }
        return store[key];
      }
      function saveColumnWidth(group,key,width){
        const store=readColPrefsStore(), ukey=activeUser?.id || 'default';
        store[ukey] ||= { columnWidths:{}, columnOrder:{}, hiddenColumns:[] };
        store[ukey].columnWidths[group] ||= {};
        store[ukey].columnWidths[group][key]=width;
        writeColPrefsStore(store);
      }
      function saveColumnOrder(group,order){
        const store=readColPrefsStore(), ukey=activeUser?.id || 'default';
        store[ukey] ||= { columnWidths:{}, columnOrder:{}, hiddenColumns:[] };
        store[ukey].columnOrder ||= {};
        store[ukey].columnOrder[group]=order;
        writeColPrefsStore(store);
      }
      function saveHiddenColumns(hidden){
        const store=readColPrefsStore(), ukey=activeUser?.id || 'default';
        store[ukey] ||= { columnWidths:{}, columnOrder:{}, hiddenColumns:[] };
        store[ukey].hiddenColumns=hidden;
        writeColPrefsStore(store);
      }
      // El tema ahora es unico por dispositivo (misma llave que usan
      // login.html y cliente.html), no por usuario: si lo cambias aca,
      // debe verse igual al volver al login o entrar al portal del
      // cliente en el mismo navegador. USER_THEME_KEY queda sin uso (se
      // deja declarada por compatibilidad con datos viejos).
      function userTheme(){ return localStorage.getItem(UI_THEME_KEY)||'light'; }
      function saveUserTheme(theme){
        localStorage.setItem(UI_THEME_KEY,theme);
      }
      function readDriverViewDateStore(){ try{ return JSON.parse(localStorage.getItem(DRIVER_VIEW_DATE_KEY))||{}; }catch(_){ return {}; } }
      function realToday(){ return cachedServerDate || today(); }
      function driverViewDateOverride(){
        if(!isDriverRole()) return '';
        const entry=readDriverViewDateStore()[activeUser.id];
        if(!entry) return '';
        if(entry.setOn !== realToday()) return '';
        return entry.date || '';
      }
      function setDriverViewDate(dateStr){
        if(!isDriverRole()) return;
        const store=readDriverViewDateStore();
        if(dateStr) store[activeUser.id]={date:dateStr, setOn:realToday()}; else delete store[activeUser.id];
        localStorage.setItem(DRIVER_VIEW_DATE_KEY,JSON.stringify(store));
      }
      function workDate(){ return isDriverRole() ? (driverViewDateOverride() || state.currentDate) : state.currentDate; }
      function handleWorkDateChange(newDate){
        if(isDriverRole()){ setDriverViewDate(newDate); ui.forceLiveDispatch=false; renderDispatch(); return; }
        if(!canEditPage('dispatch'))return;
        const last=lastProcessedDate(), maxAllowed=last?nextDay(last):null;
        if(maxAllowed && newDate>maxAllowed){
          notice(`Primero hay que procesar ${last.split('-').reverse().join('/')} -- no se puede saltar a ${newDate.split('-').reverse().join('/')} dejando días sin cerrar entre medio.`,true);
          renderDispatch();
          return;
        }
        state.currentDate=newDate; day(newDate); ui.forceLiveDispatch=false; save(); renderDispatch();
      }
      function resetDriverViewToToday(){ setDriverViewDate(realToday()); ui.forceLiveDispatch=false; renderDispatch(); }

      const ROLE_LABELS = {admin:'Administrador', editor:'Editor', kitchen:'Cocina', driver:'Driver', superadmin:'Super Administrador'};
      const NAV_PERMS = {
        dispatch: ['admin','editor','kitchen','driver','superadmin'],
        delivery: ['admin','editor','driver','superadmin'],
        clients: ['admin','editor','driver','superadmin'],
        drivers: ['admin','editor','superadmin'],
        routes: ['admin','editor','superadmin'],
        plans: ['admin','editor','superadmin'],
        payroll: ['admin','editor','driver','superadmin'],
        metrics: ['admin','editor','superadmin'],
        inventory: ['admin','editor','kitchen','superadmin'],
        users: ['admin','superadmin'],
        audit: ['admin','superadmin'],
        notes: ['admin','editor','superadmin'],
        settings: ['admin','editor','kitchen','driver','superadmin']
      };
      const PREMIUM_LOCKABLE_PAGES = [
        ['notes','Notas'],
        ['payroll','Sueldos'],
        ['inventory','Inventario'],
        ['audit','Auditoría'],
        ['metrics','Métricas'],
        ['delivery','Despacho'],
        ['returnDate','Fecha de retorno (reactivación automática)'],
        ['weeklySchedule','Horario semanal (cliente)'],
        ['exportDiets','Imprimir dietas especiales'],
        ['clientPortal','Portal web de clientes']
      ];
      const PREMIUM_DEFAULT_LOCKED = {notes:true,payroll:true,inventory:true,audit:true,metrics:true,delivery:false,returnDate:true,weeklySchedule:true,exportDiets:true,clientPortal:true};
      function isPagePremiumLocked(page){
        const cfg = state.settings.premiumLockedPages;
        if (!cfg || !(page in cfg)) return !!PREMIUM_DEFAULT_LOCKED[page];
        return !!cfg[page];
      }
      const pageNeedsPremium = page => isPagePremiumLocked(page) && !hasPremiumAccess();

      const ROLE_PAGE_OPTIONS = [
        ['dispatch','Día de trabajo',true],
        ['delivery','Despacho',true],
        ['clients','Clientes',true],
        ['drivers','Drivers',true],
        ['routes','Rutas',true],
        ['plans','Planes',true],
        ['payroll','Sueldos',true],
        ['inventory','Inventario',true],
        ['metrics','Métricas',false],
        ['notes','Notas',true],
        ['audit','Auditoría',false],
        ['settings','Configuración',false]
      ];
      const role = () => activeUser?.role || 'driver';
      const isAdmin = () => role() === 'admin' || role() === 'superadmin';
      const isSuperAdmin = () => role() === 'superadmin';
      const isDriverRole = () => role() === 'driver';
      const isKitchenRole = () => role() === 'kitchen';
      const isBuiltinRole = () => !!ROLE_LABELS[role()];
      function customRole(id){ return (state.settings.customRoles||[]).find(r=>r.id===id); }
  
      function roleLabel(r){ return ROLE_LABELS[r] || customRole(r)?.label || r || 'Usuario'; }

      const canManage = () => ['admin','editor','superadmin'].includes(role());
      const canManageInventory = () => ['admin','editor','kitchen','superadmin'].includes(role());
      const canManageDelivery = () => ['admin','editor','driver','superadmin'].includes(role());
      function canAccessPage(page){
        if (page === 'users') return isAdmin();
        if (isBuiltinRole()) return (NAV_PERMS[page] || []).includes(role());

      function enableTableTools(){
      function syncTableWidth(tbl,cols){
        cols=cols||$$('colgroup col',tbl);
        const sum=cols.reduce((a,c)=>a+(parseFloat(c.style.width)||0),0);
        if(sum>0){ tbl.style.width=sum+'px'; }
        else { const min=tbl.closest('.sheet')?.clientWidth; if(min) tbl.style.width=min+'px'; }
      }
      $$('.sheet table').forEach(tbl=>{
          const cols=$$('colgroup col',tbl);
          syncTableWidth(tbl,cols);
          $$('.resize-handle',tbl).forEach((handle,index)=>{
            const headCell=handle.parentElement, col=cols[index];
            if(!col) return;
            handle.onpointerdown=e=>{
              e.preventDefault(); e.stopPropagation();
              handle.setPointerCapture(e.pointerId);
              document.body.classList.add('col-dragging');
              const initial=headCell.getBoundingClientRect().width, start=e.clientX;
              const move=ev=>{ const width=Math.max(28,Math.round(initial+ev.clientX-start)); col.style.width=width+'px'; syncTableWidth(tbl,cols); };
              const up=()=>{
                handle.removeEventListener('pointermove',move);
                handle.removeEventListener('pointerup',up);
                handle.removeEventListener('pointercancel',up);
                document.body.classList.remove('col-dragging');
                const group=headCell.dataset.group, key=headCell.dataset.sort;
                if(group && key) saveColumnWidth(group,key,parseInt(col.style.width,10));
              };
              handle.addEventListener('pointermove',move);
              handle.addEventListener('pointerup',up);
              handle.addEventListener('pointercancel',up);
            };
            handle.ondblclick=e=>{
              e.preventDefault(); e.stopPropagation();
              const group=headCell.dataset.group, key=headCell.dataset.sort;
              const labelClone=headCell.cloneNode(true);
              labelClone.querySelectorAll('.col-drag-handle,.resize-handle,.sort-ind').forEach(el=>el.remove());
              const width=defaultColWidth(labelClone.textContent.trim(),key,group);
              col.style.width=width+'px'; syncTableWidth(tbl,cols);
              if(group && key) saveColumnWidth(group,key,width);
            };
          });
        });
        [
          { group:'dispatch', allKeys:['order','name','route','driver','plan',...menuItems().map(([key])=>key),'address1','maps','phone1','phone2','notes','specialDiet','career','bags','status','remaining','returnDate','id'] },

            const head=grip.parentElement;

              e.preventDefault(); e.stopPropagation();

      function openDeliveryMark(clientId, kind){
        if (!canEditPage('delivery')) { notice('No tienes permiso para marcar entregas.', true); return; }
        const date = workDate();
        if (day(date)?.processed) { notice('Ese día ya fue procesado y quedó congelado -- no se pueden marcar más entregas. Si hace falta corregir algo, un admin/editor puede "Desprocesar día" desde Día de trabajo.', true); return; }
        const c = state.clients.find(x => x.id === clientId); if (!c) return;
        const existing = deliveryRecord(date, clientId);
        const title = (kind === 'no_entregado' ? 'No entregado — ' : 'Entregado — ') + c.name;
        showModal(title, deliveryMarkForm(kind, existing), async f => {
          const data = Object.fromEntries(new FormData(f));
          const file = f.elements['photoFile']?.files?.[0];
          let image = existing?.status === kind ? (existing.image || '') : '';
          if (file) {
            try { image = await uploadImageFile(file, 'delivery', 360, .55, image); }
            catch (_) { notice('No se pudo procesar la foto.', true); return false; }
          }
          const reason = (data.reason || '').trim();
          if (kind === 'no_entregado' && !reason) { notice('Debes indicar el motivo.', true); return false; }
          const payload = { status: kind, reason: kind === 'no_entregado' ? reason : '', note: (data.note || '').trim(), image, at: new Date().toISOString(), by: activeUser?.name || roleLabel(role()) };
          const ok = await saveDeliveryRecord(date, clientId, payload);
          renderDelivery();
          notice(ok ? (kind === 'no_entregado' ? 'Marcado como no entregado.' : 'Marcado como entregado.') : 'Se guardó localmente, pero no en la base de datos.', !ok);
          logAudit(kind === 'no_entregado' ? 'Pedido marcado no entregado' : 'Pedido marcado entregado', 'delivery', c.name, c.id, { fecha: date, motivo: payload.reason || undefined });
        });
      }
      async function clearDelivery(clientId){
        if (!canEditPage('delivery')) { notice('No tienes permiso para hacer esto.', true); return; }

        if (day(date)?.processed) { notice('Ese día ya fue procesado y quedó congelado -- no se puede modificar la entrega.', true); return; }
        if (!confirm('¿Quitar la marca de entrega de este pedido?')) return;
        const prev = deliveryRecord(date, clientId);
        if (prev?.image) removeStorageImageByUrl(prev.image);
        const ok = await saveDeliveryRecord(date, clientId, { status: 'pendiente', reason: '', note: '', image: '', at: new Date().toISOString(), by: activeUser?.name || roleLabel(role()) });

      function scrollToRow(id){

      function openClient(id){
        let c=id?state.clients.find(x=>x.id===id):null;
        const isNew=!c;
        showModal(c?'Editar cliente':'Añadir cliente',clientForm(c||{}),async f=>{
          const addresses=f._getAddresses?f._getAddresses():[];
          if(!addresses.length || !addresses[0].address){ notice('Agrega al menos una dirección.',true); return false; }
          let activeAddressId=addresses[0].id;
          if(addresses.length>=2){
            activeAddressId=f.elements.activeAddressId?.value||'';
            if(!activeAddressId){ notice('Selecciona cuál dirección está activa hoy.',true); return false; }
          }
          const activeAddr=addresses.find(a=>a.id===activeAddressId)||addresses[0];
          if(!activeAddr?.routeId){ notice('La dirección activa necesita una ruta seleccionada.',true); return false; }
          const data=syncClientRouteAndDriver(Object.fromEntries(new FormData(f))); data.items=formItems(f);
          if(c && data.cancelPendingPlan){ data.pendingPlan=null; }
          delete data.cancelPendingPlan;
          if(c && data.planId && data.planId!==c.planId && n(c.paidDays)>n(c.consumedDays)){
            const newPlan=plan(data.planId);
            const mode=data.planChangeMode||'immediate';
            if(mode==='carry'){
              const threshold=n(c.paidDays);
              data.paidDays=threshold+n(newPlan?.serviceDays);
              data.consumedDays=n(c.consumedDays);
              data.pendingPlan={planId:data.planId,activateAtConsumedDays:threshold};
              data.planId=c.planId;
              data.items=c.items||{};
            } else {
              if(n(newPlan?.serviceDays)>0){ data.paidDays=n(newPlan.serviceDays); data.consumedDays=0; }
              data.pendingPlan=null;
            }
          }
          delete data.planChangeMode;
          data.schedule=readScheduleRows(f);
          data.addresses=addresses; data.activeAddressId=activeAddressId;
          data.routeId=activeAddr.routeId;
          if(activeAddr?.driverId) data.driverId=activeAddr.driverId;
          if(!pageNeedsPremium('returnDate') && data.returnDate) data.status='Programado';
          if(data.status!=='Programado'){ data.returnDate=''; }
          else if(!pageNeedsPremium('returnDate')){
            if(!data.returnDate){ notice('El estado "Programado" requiere una fecha de retorno.',true); return false; }
            const minDate=nextDay(lastProcessedDate()||state.currentDate);
            if(data.returnDate<minDate){ notice(`La fecha de retorno debe ser posterior al último día procesado (mínimo ${minDate.split('-').reverse().join('/')}).`,true); return false; }

          const saved=await save();

          scrollToRow(c.id);

        const form=$('#modal-form'), routeField=form?.elements.routeId, driverField=form?.elements.driverId, planField=form?.elements.planId;

        if(driverField) driverField.onchange=()=>{ const d=driver(driverField.value); if(d?.routeId) routeField.value=d.routeId; };
        const originalPlanId=c?.planId||'', originalItems=c?.items||{}, planChangeWrap=$('#plan-change-choice');
        const hasRemainingBalance=!!(c && n(c.paidDays)>n(c.consumedDays));

            menuItems().forEach(([key])=>{ const input=form.elements[key]; if(input) input.value=n(originalItems[key]); });

      // "Renovar": suma días al plan del cliente en vez de tener que editar
      // a mano el campo "Días pagados". Dos casos:
      //  - Mismo plan (el caso más común: "está en Almuerzo y renueva
      //    Almuerzo") -> simplemente c.paidDays += días a agregar. Si
      //    además tiene un cambio de plan programado (pendingPlan), el
      //    umbral en el que se activa también se corre esos mismos días,
      //    para que no salte antes de tiempo.
      //  - Plan distinto -> si todavía le quedan días del plan actual, se
      //    ofrece la misma elección que ya existe al editar un cliente
      //    (cambiar de inmediato / conservar y sumar en cola). Si ya no le
      //    quedan días (Retorno pendiente, el caso típico de "se le venció
      //    y renueva"), no hay nada que conservar: pasa directo al plan
      //    nuevo sumando los días indicados.
      // En cualquier caso, si el cliente estaba Pausado o en Retorno
      // pendiente, la renovación también lo reactiva (vuelve a Activo).
      function openRenewClient(id, fromNoteId, initialMode='renew', returnToEdit=false){
        const c=state.clients.find(x=>x.id===id);if(!c)return;
        const hasRemainingBalance=n(c.paidDays)>n(c.consumedDays);
        const remaining=Math.max(0,n(c.paidDays)-n(c.consumedDays));
        const isChangeMode=initialMode==='change';
        // En modo "Añadir nuevo plan" no se preselecciona ningún plan (antes
        // elegía automáticamente el primero distinto al actual, lo que se
        // sentía como un plan "adivinado" al azar); se deja en blanco para
        // que el usuario elija a propósito.
        const defaultPlanId=isChangeMode?'':c.planId;
        const showChoiceByDefault=isChangeMode && defaultPlanId && defaultPlanId!==c.planId && hasRemainingBalance;
        const html=`<div class="form-grid">
          <div class="wide plan-summary-row" style="margin:0"><div class="plan-option-info"><b>${esc(c.name)}</b><span class="muted">Plan actual: ${esc(planName(c.planId))} · ${hasRemainingBalance?`le quedan ${remaining} día(s)`:'sin días restantes (Retorno pendiente)'}</span></div></div>
          <label>${isChangeMode?'Nuevo plan':'Plan a renovar'}<select name="planId">${options(state.plans,defaultPlanId,isChangeMode?'Elige un plan…':'Sin plan')}</select></label>
          <label>Días a agregar *<input name="days" type="number" min="1" step="1" required value="${n(plan(defaultPlanId)?.serviceDays)||''}"></label>
          <div class="wide" id="renew-plan-change-choice" ${showChoiceByDefault?'':'hidden'}><div class="plan-options"><label class="plan-option" style="cursor:pointer"><div class="plan-option-info"><b>Cambiar de inmediato</b><span class="muted">Se pierden los días restantes del plan actual; el nuevo plan y sus días empiezan a contar desde hoy.</span></div><input type="radio" name="planChangeMode" value="immediate" ${showChoiceByDefault?'':'checked'}></label><label class="plan-option" style="cursor:pointer"><div class="plan-option-info"><b>Conservar los días actuales y sumar</b><span class="muted">Termina primero el plan actual y pasa al nuevo recién cuando se acaben esos días.</span></div><input type="radio" name="planChangeMode" value="carry" ${showChoiceByDefault?'checked':''}></label></div></div>
        </div>`;
        showModal(isChangeMode?'Añadir nuevo plan':'Renovar plan',html,async f=>{
          const data=Object.fromEntries(new FormData(f));
          const days=n(data.days);
          if(!days || days<1){ notice('Ingresa cuántos días agregar.',true); return false; }
          const samePlan=!data.planId || data.planId===c.planId;
          if(samePlan){
            c.paidDays=n(c.paidDays)+days;
            if(c.pendingPlan) c.pendingPlan.activateAtConsumedDays=n(c.pendingPlan.activateAtConsumedDays)+days;
          } else {
            const newPlan=plan(data.planId);
            const mode=data.planChangeMode||'immediate';
            if(hasRemainingBalance && mode==='carry'){
              const threshold=n(c.paidDays);
              c.paidDays=threshold+days;
              c.pendingPlan={planId:data.planId,activateAtConsumedDays:threshold};
            } else {
              c.planId=data.planId;
              c.items=newPlan?.items||{};
              c.paidDays=n(c.paidDays)+days;
              c.pendingPlan=null;
            }
          }
          if(c.status==='Pausado' || c.status==='Retorno pendiente'){ c.status='Activo'; c.pauseStart=''; c.pauseDates=[]; }
          const saved=await save();
          if(!saved)return false;
          renderPage(ui.page);notice(samePlan?`Plan de ${c.name} renovado.`:`Nuevo plan asignado a ${c.name}.`);
          scrollToRow(c.id);
          logAudit(samePlan?'Cliente renovado':'Nuevo plan asignado','client',c.name,c.id,{plan:planName(c.planId),diasAgregados:days,modo:samePlan?'mismo-plan':(data.planChangeMode||'immediate')});
          if(fromNoteId) await markNoteDone(fromNoteId);
        }, returnToEdit?()=>openClient(id):null);
        const form=$('#modal-form'), planField=form?.elements.planId, daysField=form?.elements.days, choiceWrap=$('#renew-plan-change-choice');
        if(planField) planField.onchange=()=>{
          const p=plan(planField.value);
          if(daysField && p?.serviceDays) daysField.value=n(p.serviceDays);
          const isDifferentPlan=planField.value && planField.value!==c.planId;
          if(choiceWrap){ choiceWrap.hidden=!(isDifferentPlan && hasRemainingBalance); if(!choiceWrap.hidden) form.elements.planChangeMode.value=isDifferentPlan?'carry':'immediate'; }
        };
      }
      function openQuickStatus(id){
        const c=state.clients.find(x=>x.id===id);if(!c)return;
        const current=c.status||'Activo';
        const statusOptions=['Activo','Pausado','Retorno pendiente','Programado'];
        const html=`<div class="form-grid"><label class="wide">Estado<select name="status" id="quick-status">${statusOptions.map(s=>`<option value="${s}" ${current===s?'selected':''}>${s}</option>`).join('')}</select></label><label class="wide">Fecha de retorno${!pageNeedsPremium('returnDate')?`<input name="returnDate" id="quick-returndate" type="date" min="${nextDay(lastProcessedDate()||state.currentDate)}" value="${current==='Programado'?esc(c.returnDate):''}" ${current==='Programado'?'':'disabled'}>`:` <span class="muted" style="font-weight:400">🔒 Función Premium</span><input type="hidden" name="returnDate" value="${esc(c.returnDate)}">`}</label></div>`;
        showModal(`Cambiar estado · ${c.name}`,html,async f=>{
          const data=Object.fromEntries(new FormData(f));
          if(!pageNeedsPremium('returnDate') && data.returnDate) data.status='Programado';
          if(data.status!=='Programado'){ data.returnDate=''; }
          else if(!pageNeedsPremium('returnDate')){
            if(!data.returnDate){ notice('El estado "Programado" requiere una fecha de retorno.',true); return false; }
            const minDate=nextDay(lastProcessedDate()||state.currentDate);
            if(data.returnDate<minDate){ notice(`La fecha de retorno debe ser posterior al último día procesado (mínimo ${minDate.split('-').reverse().join('/')}).`,true); return false; }
          }
          if(data.status==='Pausado') c.pauseStart=state.currentDate;
          if(data.status==='Activo'){ c.pauseStart=''; c.pauseDates=[]; }
          c.status=data.status;c.returnDate=data.returnDate;

      async function cleanupOldProofImages(){
        if(!canEditPage('notes')) return;
        const PROOF_MAX_AGE_MS=7*24*60*60*1000;
        const now=Date.now();
        const stale=state.notes.filter(nt=>{
          if(!nt.createdAt) return false;
          const url=extractProofUrl(nt.text);
          if(!url) return false;
          const age=now-new Date(nt.createdAt).getTime();
          return Number.isFinite(age) && age>PROOF_MAX_AGE_MS;
        });
        if(!stale.length) return;
        for(const nt of stale){
          const url=extractProofUrl(nt.text);
          try{ await removeStorageImageByUrl(url); }catch(_){}
          nt.text=nt.text.replace(/\s*Comprobante:\s*https?:\/\/\S+/,'').trim()+' (comprobante eliminado automáticamente: pasaron más de 7 días)';
        }

        if(!saved) console.warn('No se pudo guardar la limpieza de comprobantes vencidos.');
      }
      // Igual que cleanupOldProofImages pero para las fotos de respaldo que
      // suben admin/editor/driver al marcar una entrega (folder 'delivery').
      // Esas fotos no se reemplazan solas como el logo o el QR -- si nadie
      // las borra a mano, se quedan para siempre en Storage. Revisa TODAS

      // completo de db_delivery_status en vez de usar deliveryCache (que
      // solo tiene cargadas las fechas que el usuario fue abriendo).
      async function cleanupOldDeliveryPhotos(){
        if(!canEditPage('dispatch')) return;
        const PHOTO_MAX_AGE_MS=7*24*60*60*1000;
        const now=Date.now();
        let rows;
        try{ rows = await window.SupabaseDB?.dbGetAllDeliveryStatus(null); }catch(_){ return; }
        if(!Array.isArray(rows) || !rows.length) return;
        const stale=rows.filter(r=>{
          const img=r.payload?.image;
          if(!img) return false;
          const at=r.payload?.at;
          if(!at) return false;
          const age=now-new Date(at).getTime();
          return Number.isFinite(age) && age>PHOTO_MAX_AGE_MS;
        });
        if(!stale.length) return;
        const upserts=[];
        for(const r of stale){
          try{ await removeStorageImageByUrl(r.payload.image); }catch(_){}
          const payload={...r.payload, image:''};
          upserts.push({date:r.date, clientId:r.clientId, payload});
          const cached=deliveryCache[r.date];
          if(cached){
            const idx=cached.findIndex(x=>x.clientId===r.clientId);
            if(idx>=0) cached[idx]={clientId:r.clientId, ...payload};
          }
        }
        const ok=await window.SupabaseDB?.dbUpsertDeliveryRows(upserts);
        if(ui.page==='delivery') renderDelivery();

      }
      function daysSince(dateStr, refStr){
        const d=new Date(dateStr), r=new Date(refStr);
        if(isNaN(d)||isNaN(r)) return null;
        return Math.floor((r-d)/86400000);
      }
      // Regla de retención: un cliente en "Retorno pendiente" (agotó sus
      // días pagados, sin renovar) y SIN ninguna entrega marcada durante 2
      // años seguidos se borra directamente -- junto con sus fotos de
      // entrega en Storage, para no dejar huérfanos. Sin etapa intermedia
      // de archivado: hasta el día antes de cumplir los 2 años el cliente
      // sigue funcionando 100% normal (incluido su acceso al portal).
      // La "última actividad" es la fecha de entrega más reciente en
      // db_delivery_status; si el cliente nunca tuvo ninguna entrega
      // registrada, se usa su startDate como referencia, para no borrar
      // por error a un cliente recién creado que todavía no tuvo su
      // primera entrega.
      async function cleanupInactiveClients(){
        if(!canEditPage('clients')) return;
        const DELETE_AFTER_DAYS=730; // 2 años
        const refDate=workDate?.()||state.currentDate||today();
        let rows;
        try{ rows = await window.SupabaseDB?.dbGetAllDeliveryStatus(null); }catch(_){ rows = null; }
        const lastDeliveryByClient={};
        if(Array.isArray(rows)){
          for(const r of rows){
            if(!r.date) continue;
            if(!lastDeliveryByClient[r.clientId] || r.date>lastDeliveryByClient[r.clientId]) lastDeliveryByClient[r.clientId]=r.date;
          }
        }
        const toDelete=[];
        for(const c of state.clients){
          if(status(c, refDate)!=='Retorno pendiente') continue;
          const lastActivity=lastDeliveryByClient[c.id] || c.startDate || '';
          if(!lastActivity) continue; // sin ninguna fecha de referencia -> no tocar, por seguridad
          const d=daysSince(lastActivity, refDate);
          if(d!==null && d>=DELETE_AFTER_DAYS) toDelete.push(c);
        }
        if(!toDelete.length) return;
        for(const c of toDelete){
          if(Array.isArray(rows)){
            for(const r of rows){
              if(r.clientId===c.id && r.payload?.image){ try{ await removeStorageImageByUrl(r.payload.image); }catch(_){} }
            }
          }
          state.clients=state.clients.filter(x=>x.id!==c.id);
          logAudit('Cliente eliminado automáticamente','client',c.name,c.id,{motivo:'2 años sin entregas ni renovación (Retorno pendiente)'});
        }
        await save();
        if(['clients','dispatch','delivery'].includes(ui.page)) render();
      }

      function menuItemForm(item={}){ return `<div class="form-grid"><label class="wide">Nombre del artículo *<input name="label" required value="${esc(item.label)}" placeholder="Ej.: Postre"></label></div>`; }
      function openMenuItem(key){
        const isNew=!key;
        const current=isNew?null:state.settings.menuItems.find(x=>x.key===key);
        showModal(current?'Editar artículo':'Crear artículo',menuItemForm(current||{}),async f=>{
          const label=f.elements.label.value.trim();

          if(!saved)return false;
          renderPlans();
          notice(isNew?'Artículo creado.':'Artículo actualizado.');

      async function deleteMenuItem(key){
        const current=state.settings.menuItems.find(x=>x.key===key);
        if(!current)return;
        if(state.settings.menuItems.length<=1){notice('Debe existir al menos un artículo en el menú.',true);return;}
        if(!confirm(`¿Eliminar el artículo "${current.label}"? Se quitará de planes, clientes y vínculos de inventario que lo usen.`))return;
        state.settings.menuItems=state.settings.menuItems.filter(x=>x.key!==key);
        state.plans.forEach(p=>{ if(p.items) delete p.items[key]; });
        state.clients.forEach(c=>{ if(c.items) delete c.items[key]; });
        if(state.settings.itemIcons) delete state.settings.itemIcons[key];
        state.inventory.links=state.inventory.links.filter(l=>l.clientItemKey!==key);
        const saved=await save();
        renderPlans();
        notice(saved?'Artículo eliminado.':'Se eliminó localmente, pero no se guardó en la base de datos.',!saved);
