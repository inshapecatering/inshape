      function planForm(p={}){return `<div class="form-grid"><label>Nombre *<input name="name" required value="${esc(p.name)}"></label><label>Costo (Bs)<input type="number" min="0" step="0.01" name="cost" value="${esc(p.cost)}"></label><label>Días de servicio incluidos<input type="number" min="1" step="1" name="serviceDays" placeholder="Ej: 20" value="${esc(p.serviceDays)}"></label><label class="wide"><input type="checkbox" name="availableForPurchase" ${p.availableForPurchase?'checked':''} style="width:auto;min-height:auto;vertical-align:-2px;margin-right:6px"> Disponible en "Adquirir nuevo plan" (portal del cliente)</label><label class="wide">Foto del plan<div style="display:flex;align-items:center;gap:10px"><div style="width:52px;height:52px;border-radius:10px;overflow:hidden;border:1px solid var(--line);display:grid;place-items:center;background:var(--bg);flex:0 0 auto">${p.photoUrl?`<img loading="lazy" decoding="async" src="${p.photoUrl}" alt="" style="width:100%;height:100%;object-fit:cover">`:'🍽️'}</div><input type="file" name="photoFile" accept="image/*">${p.id&&p.photoUrl?`<button type="button" class="danger" data-action="remove-plan-photo" data-id="${p.id}">Quitar foto</button>`:''}</div></label><div class="wide"><label>Artículos incluidos</label>${itemFields(p.items)}</div></div>`;}
      async function removePlanPhoto(id){const p=plan(id);if(!p)return;if(p.photoUrl)removeStorageImageByUrl(p.photoUrl);p.photoUrl='';const saved=await save();notice(saved?'Foto eliminada.':'Se quitó localmente, pero no se guardó en la base de datos.',!saved);openPlan(id);}
      function openPlan(id){const isNew=!id;const p0=id?plan(id):null;showModal(p0?'Editar plan':'Crear plan',planForm(p0||{}),async f=>{const data=Object.fromEntries(new FormData(f));const file=f.elements['photoFile']?.files?.[0];delete data.photoFile;data.availableForPurchase=!!f.elements.availableForPurchase?.checked;data.items=formItems(f);if(file){try{data.photoUrl=await uploadImageFile(file,'plans',320,.82,p0?.photoUrl||'');}catch(_){notice('No se pudo procesar la foto.',true);}}let p=p0;if(p)Object.assign(p,data);else{p={id:uid('p'),...data};state.plans.push(p);}const saved=await save();if(!saved)return false;renderPlans();notice('Plan guardado.');logAudit(isNew?'Plan creado':'Plan editado','plan',p.name,p.id,{});});}
      function openPlanReassign(){
        const optionsList=()=>state.plans.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('');
        const html=`<div class="form-grid"><label>Plan actual (origen) *<select name="fromPlanId" id="reassign-from" required><option value="">Selecciona…</option>${optionsList()}</select></label><label>Plan nuevo (destino) *<select name="toPlanId" id="reassign-to" required><option value="">Selecciona…</option>${optionsList()}</select></label><div class="wide" id="reassign-clients-wrap"><p class="muted">Elegí el plan de origen para ver qué clientes lo tienen.</p></div></div>`;
        showModal('Reasignar clientes de plan',html,async f=>{
          const fromId=f.elements.fromPlanId.value,toId=f.elements.toPlanId.value;
          if(!fromId||!toId){notice('Selecciona el plan de origen y el de destino.',true);return false;}
          if(fromId===toId){notice('El plan de origen y destino no pueden ser el mismo.',true);return false;}
          const checked=[...f.querySelectorAll('.reassign-client-check:checked')].map(x=>x.value);
          if(!checked.length){notice('No hay clientes seleccionados para reasignar.',true);return false;}
          const targets=state.clients.filter(c=>checked.includes(c.id));
          const fromName=planName(fromId),toName=planName(toId);
          const toPlanObj=plan(toId);
          const previous=targets.map(c=>({c,planId:c.planId,items:c.items}));
          targets.forEach(c=>{c.planId=toId;c.items={...(toPlanObj?.items||{})};});
          const saved=await save();
          if(!saved){previous.forEach(({c,planId,items})=>{c.planId=planId;c.items=items;});return false;}
          renderPlans();
          notice(`${targets.length} cliente(s) reasignado(s) de "${fromName}" a "${toName}".`);
          logAudit('Clientes reasignados de plan','plan',`${fromName} → ${toName}`,toId,{clientes:targets.length});
        });
        const renderClientsList=()=>{
          const fromId=$('#reassign-from').value;
          const wrap=$('#reassign-clients-wrap');
          if(!fromId){wrap.innerHTML='<p class="muted">Elegí el plan de origen para ver qué clientes lo tienen.</p>';return;}
          const list=state.clients.filter(c=>c.planId===fromId);
          if(!list.length){wrap.innerHTML=`<p class="muted">No hay clientes con el plan "${esc(planName(fromId))}".</p>`;return;}
          wrap.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px"><b>Clientes con este plan (${list.length})</b><button type="button" class="outline" id="reassign-toggle-all" style="padding:4px 10px">Seleccionar/quitar todos</button></div><div style="max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:8px;display:grid;gap:4px">${list.map(c=>`<label style="display:flex;align-items:center;gap:8px"><input type="checkbox" class="reassign-client-check" value="${c.id}" checked>${esc(c.name)}</label>`).join('')}</div>`;
          $('#reassign-toggle-all').onclick=()=>{const boxes=[...wrap.querySelectorAll('.reassign-client-check')];const allChecked=boxes.every(b=>b.checked);boxes.forEach(b=>b.checked=!allChecked);};
        };
        $('#reassign-from').onchange=renderClientsList;
      }

      function kitchenItem(id){ return state.inventory.items.find(x=>x.id===id); }
      function clientItemQuantity(c,key){ const own=c.items && Object.keys(c.items).length ? c.items : plan(c.planId)?.items || {}; return n(own[key]); }
      function inventoryItemForm(item={}){ return `<div class="form-grid"><label>Producto de cocina *<input name="name" required value="${esc(item.name)}" placeholder="Ej.: Envase mediano"></label><label>Unidad *<input name="unit" required value="${esc(item.unit||'unidades')}" placeholder="unidades, kg, litros"></label><label>Stock inicial / actual<input name="stock" type="number" step="0.01" value="${n(item.stock)}"></label><label>Stock mínimo<input name="minimum" type="number" min="0" step="0.01" value="${n(item.minimum)}"></label></div>`; }
      function openInventoryItem(id){ const isNew=!id; const item0=id?kitchenItem(id):null; showModal(item0?'Editar producto':'Añadir producto de cocina',inventoryItemForm(item0||{}),async f=>{const data=Object.fromEntries(new FormData(f));let item=item0;if(item)Object.assign(item,data);else{item={id:uid('inv'),...data};state.inventory.items.push(item);}const saved=await save();if(!saved)return false;renderInventory();notice('Producto de inventario guardado.');logAudit(isNew?'Producto de inventario creado':'Producto de inventario editado','inventory-item',item.name,item.id,{});}); }
      function inventoryOptions(current=''){ return `<option value="">Seleccionar producto</option>`+state.inventory.items.map(x=>`<option value="${x.id}" ${x.id===current?'selected':''}>${esc(x.name)} (${esc(x.unit||'unidades')})</option>`).join(''); }
      function inventoryMovementForm(type,m={}){ const title=(m.id?'Editar ':'')+(type==='entry'?'Ingreso de producto':type==='waste'?'Salida por merma':'Salida por uso'); return {title,html:`<div class="form-grid"><label>Fecha<input name="date" type="date" value="${m.date||state.currentDate}"></label><label>Producto *<select name="inventoryId" required>${inventoryOptions(m.inventoryId)}</select></label><label>Cantidad *<input name="quantity" type="number" min="0.01" step="0.01" required value="${m.id?Math.abs(n(m.quantity)):''}"></label><label>Motivo / detalle<input name="note" required placeholder="Ej.: recepción proveedor" value="${esc(m.note)}"></label></div>`}; }
      function openInventoryMovement(type,id){
        const existing=id?state.inventory.movements.find(x=>x.id===id):null;
        const form=inventoryMovementForm(type,existing||{});
        showModal(form.title,form.html,async f=>{
          const data=Object.fromEntries(new FormData(f)), item=kitchenItem(data.inventoryId); if(!item)return false;
          const qty=n(data.quantity), delta=type==='entry'?qty:-qty;
          if(existing){ const oldItem=kitchenItem(existing.inventoryId); if(oldItem)oldItem.stock=n(oldItem.stock)-n(existing.quantity); }
          item.stock=n(item.stock)+delta;
          if(existing){ Object.assign(existing,{date:data.date,inventoryId:data.inventoryId,type,quantity:delta,note:data.note}); }
          else state.inventory.movements.unshift({id:uid('mov'),date:data.date,inventoryId:data.inventoryId,type,quantity:delta,note:data.note});
          const saved=await save(); if(!saved)return false;
          renderInventory();notice(existing?'Movimiento actualizado.':(type==='entry'?'Ingreso registrado.':'Salida de inventario registrada.'));
          logAudit(existing?'Movimiento de inventario editado':'Movimiento de inventario registrado','inventory-movement',item.name,existing?.id||'',{tipo:type,cantidad:delta,motivo:data.note,fecha:data.date});
        });
      }
      async function deleteInventoryMovement(id){
        const m=state.inventory.movements.find(x=>x.id===id); if(!m||m.type==='delivery')return;
        if(!confirm('¿Eliminar este movimiento? Se revertirá su efecto sobre el stock.'))return;
        const item=kitchenItem(m.inventoryId); if(item)item.stock=n(item.stock)-n(m.quantity);
        state.inventory.movements=state.inventory.movements.filter(x=>x.id!==id);
        const saved=await save(); renderInventory();
        notice(saved?'Movimiento eliminado y stock ajustado.':'Se eliminó localmente, pero no se guardó en la base de datos.',!saved);
        if(saved) logAudit('Movimiento de inventario eliminado','inventory-movement',item?.name||m.inventoryId,m.id,{tipo:m.type,cantidad:m.quantity,motivo:m.note});
      }
      function inventoryLinkForm(link={}){ return `<div class="form-grid"><label>Producto de cocina *<select name="inventoryId" required>${inventoryOptions(link.inventoryId)}</select></label><label>Artículo entregado al cliente *<select name="clientItemKey" required>${menuItems().map(([key,label])=>`<option value="${key}" ${link.clientItemKey===key?'selected':''}>${label}</option>`).join('')}</select></label><label class="wide">Cantidad a descontar por cada artículo entregado *<input name="quantity" type="number" min="0.01" step="0.01" required value="${n(link.quantity)||1}"></label></div>`; }
      function openInventoryLink(id){ const isNew=!id; const link0=id?state.inventory.links.find(x=>x.id===id):null; showModal(link0?'Editar vínculo de consumo':'Vincular consumo a artículo entregado',inventoryLinkForm(link0||{}),async f=>{const data=Object.fromEntries(new FormData(f));let link=link0;if(link)Object.assign(link,data);else{link={id:uid('link'),...data};state.inventory.links.push(link);}const saved=await save();if(!saved)return false;renderInventory();notice('Vínculo de consumo guardado.');logAudit(isNew?'Vínculo de consumo creado':'Vínculo de consumo editado','inventory-link',kitchenItem(link.inventoryId)?.name||link.inventoryId,link.id,{});}); }
      async function deleteInventoryItem(id){ const item=kitchenItem(id); if(!item || !confirm(`¿Eliminar ${item.name} del inventario?`))return; state.inventory.items=state.inventory.items.filter(x=>x.id!==id); state.inventory.links=state.inventory.links.filter(x=>x.inventoryId!==id); const saved=await save();renderInventory();notice(saved?'Producto eliminado.':'Se eliminó localmente, pero no se guardó en la base de datos.',!saved); if(saved) logAudit('Producto de inventario eliminado','inventory-item',item.name,id,{}); }
      async function deleteInventoryLink(id){ const link=state.inventory.links.find(x=>x.id===id); if(!link||!confirm('¿Eliminar este vínculo de consumo?'))return; state.inventory.links=state.inventory.links.filter(x=>x.id!==id);const saved=await save();renderInventory();notice(saved?'Vínculo eliminado.':'Se eliminó localmente, pero no se guardó en la base de datos.',!saved); if(saved) logAudit('Vínculo de consumo eliminado','inventory-link',kitchenItem(link.inventoryId)?.name||link.inventoryId,id,{}); }
      function renderInventory(){
        if(!canAccessPage('inventory')) return;
        if(pageNeedsPremium('inventory')){ $('#inventory-page').innerHTML=pageHead('Inventario','Controla existencias de cocina.')+premiumLockHtml('Inventario'); return; }
        const itemDefs=[
          {key:'name',label:'Producto',cell:item=>{const low=n(item.stock)<=n(item.minimum);return `<b>${esc(item.name)}</b>${low?' <span class="badge warn">Stock bajo</span>':''}`;}},
          {key:'unit',label:'Unidad',cell:item=>esc(item.unit||'unidades')},
          {key:'stock',label:'Stock',cell:item=>n(item.stock)},
          {key:'minimum',label:'Mínimo',cell:item=>n(item.minimum)},
          {key:'links',label:'Se descuenta con',cell:item=>{const links=state.inventory.links.filter(l=>l.inventoryId===item.id);return links.length?links.map(l=>`${n(l.quantity)} × ${esc(menuItems().find(([key])=>key===l.clientItemKey)?.[1]||l.clientItemKey)}`).join('<br>'):'—';}},
          {key:'id',label:'Acciones',cell:item=>canEditPage('inventory')?`<button class="icon-btn" data-action="edit-inventory-item" data-id="${item.id}">Editar</button><button class="icon-btn delete" data-action="delete-inventory-item" data-id="${item.id}">×</button>`:'—'}
        ];
        const linkDefs=[
          {key:'inventoryId',label:'Producto de cocina',cell:link=>esc(kitchenItem(link.inventoryId)?.name||'Producto eliminado')},
          {key:'clientItemKey',label:'Artículo entregado',cell:link=>esc(menuItems().find(([key])=>key===link.clientItemKey)?.[1]||link.clientItemKey)},
          {key:'quantity',label:'Cantidad por entrega',cell:link=>n(link.quantity)},
          {key:'id',label:'Acciones',cell:link=>canEditPage('inventory')?`<button class="icon-btn" data-action="edit-inventory-link" data-id="${link.id}">Editar</button><button class="icon-btn delete" data-action="delete-inventory-link" data-id="${link.id}">×</button>`:'—'}
        ];
        const movementDefs=[
          {key:'date',label:'Fecha',cell:m=>esc(m.date)},
          {key:'inventoryId',label:'Producto',cell:m=>esc(kitchenItem(m.inventoryId)?.name||'Producto eliminado')},
          {key:'quantity',label:'Cantidad',cell:m=>m.quantity>0?`+${n(m.quantity)}`:n(m.quantity)},
          {key:'type',label:'Tipo',cell:m=>m.type==='entry'?'Ingreso':m.type==='waste'?'Merma':m.type==='delivery'?'Entrega procesada':'Uso'},
          {key:'note',label:'Detalle',cell:m=>esc(m.note||'—')},
          {key:'id',label:'Acciones',cell:m=>canEditPage('inventory')&&m.type!=='delivery'?`<button class="icon-btn" data-action="edit-inventory-movement" data-id="${m.id}">Editar</button><button class="icon-btn delete" data-action="delete-inventory-movement" data-id="${m.id}">×</button>`:'—'}
        ];
        const recent=state.inventory.movements.slice(0,12);
        const actions=canEditPage('inventory')?`<button class="primary" data-action="add-inventory-item">+ Producto de cocina</button><button class="success" data-action="add-inventory-entry">+ Ingreso</button><button class="warning" data-action="add-inventory-use">− Uso</button><button class="danger" data-action="add-inventory-waste">− Merma</button><button class="info" data-action="add-inventory-link">Vincular consumo</button>`:'';
        $('#inventory-page').innerHTML=pageHead('Inventario','Controla existencias de cocina. Los vínculos descuentan insumos automáticamente al procesar pedidos activos.',actions)+`<div class="two-col"><div class="card card-pad"><h3 style="margin-bottom:12px">Productos de cocina</h3>${orderedTable(state.inventory.items,itemDefs,'inventory')}</div><div class="card card-pad"><h3 style="margin-bottom:12px">Vínculos de consumo</h3>${orderedTable(state.inventory.links,linkDefs,'inventory-links')}</div></div><div class="card card-pad" style="margin-top:18px"><h3 style="margin-bottom:12px">Últimos movimientos</h3>${orderedTable(recent,movementDefs,'inventory-movements')}</div>`;
      }
      function applyInventoryForProcessedDay(date){
        const active=state.clients.filter(c=>status(c,date)==='Activo');
        state.inventory.links.forEach(link=>{
          const item=kitchenItem(link.inventoryId); if(!item)return;
          const delivered=active.reduce((sum,c)=>sum+clientItemQuantity(c,link.clientItemKey),0), used=delivered*n(link.quantity);
          if(!used)return;
          item.stock=n(item.stock)-used;
          state.inventory.movements.unshift({id:uid('mov'),date,inventoryId:item.id,type:'delivery',quantity:-used,note:`Descuento automático: ${delivered} ${menuItems().find(([key])=>key===link.clientItemKey)?.[1]||link.clientItemKey}`});
        });
      }
      function revertInventoryForProcessedDay(date){
        const kept=[];
        state.inventory.movements.forEach(m=>{
          if(m.type==='delivery'&&m.date===date){
            const item=kitchenItem(m.inventoryId);
            if(item)item.stock=n(item.stock)-n(m.quantity); // quantity es negativo: al restarlo, se repone
          } else kept.push(m);
        });
        state.inventory.movements=kept;
      }

      function monthDates(month){const [y,m]=month.split('-').map(Number),end=new Date(y,m,0).getDate();return Array.from({length:end},(_,i)=>`${month}-${String(i+1).padStart(2,'0')}`);}
      function dateRangeArray(start,end){
        const out=[]; let d=new Date(start+'T00:00:00'); const last=new Date(end+'T00:00:00');
        if(isNaN(d)||isNaN(last)||d>last) return out;
        while(d<=last){ out.push(d.toISOString().slice(0,10)); d.setDate(d.getDate()+1); if(out.length>370) break; }
        return out;
      }
      function haversineKm(lat1,lng1,lat2,lng2){
        const toRad=x=>x*Math.PI/180, R=6371;
        const dLat=toRad(lat2-lat1), dLng=toRad(lng2-lng1);
        const a=Math.sin(dLat/2)**2+Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLng/2)**2;
        return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
      }
      function metricsPresetRange(preset){
        const t=today();
        if(preset==='week'){ const dt=new Date(t+'T00:00:00'); const wd=(dt.getDay()+6)%7; const start=new Date(dt); start.setDate(dt.getDate()-wd); return {start:start.toISOString().slice(0,10), end:t}; }
        if(preset==='last30'){ const dt=new Date(t+'T00:00:00'); dt.setDate(dt.getDate()-29); return {start:dt.toISOString().slice(0,10), end:t}; }
        if(preset==='last90'){ const dt=new Date(t+'T00:00:00'); dt.setDate(dt.getDate()-89); return {start:dt.toISOString().slice(0,10), end:t}; }
        return {start:t.slice(0,8)+'01', end:t}; // 'month' (por defecto)
      }
      function shiftedPreviousRange(start,end){
        const s=new Date(start+'T00:00:00'), e=new Date(end+'T00:00:00');
        const days=Math.max(1, Math.round((e-s)/86400000)+1);
        const prevEnd=new Date(s); prevEnd.setDate(s.getDate()-1);
        const prevStart=new Date(prevEnd); prevStart.setDate(prevEnd.getDate()-(days-1));
        return { start: prevStart.toISOString().slice(0,10), end: prevEnd.toISOString().slice(0,10) };
      }
      async function computeMetrics(start,end,routeFilter,driverFilter,useRoadKm){
        const dates=dateRangeArray(start,end);
        await Promise.all(dates.map(d=>ensureDeliveryLoaded(d)));
        const routeStats={}, driverStats={};
        const activeDriversByDate={};
        const dailyDelivered={};
        const datesWithData=new Set();
        const routeDurations=[]; const gapMinutes=[];
        let totalScheduled=0, totalCompleted=0, totalFailed=0;
        for(const date of dates){
          dailyDelivered[date]=0;
          for(const r of state.routes){
            if(routeFilter && r.id!==routeFilter) continue;
            const fullList=deliveryListFor(r.id,date);
            if(!fullList.length) continue;
            datesWithData.add(date);
            const list=driverFilter ? fullList.filter(c=>effectiveDriverId(c,date)===driverFilter) : fullList;
            if(!list.length) continue;
            routeStats[r.id] ||= {name:r.name, completed:0, failed:0, scheduled:0, km:0, kmDays:0, durations:[], clientsPerDay:[]};
            const rs=routeStats[r.id];
            rs.scheduled+=list.length; totalScheduled+=list.length; rs.clientsPerDay.push(list.length);
            const marks=[]; const driversInvolved=new Set();
            list.forEach(c=>{
              const did=effectiveDriverId(c,date); if(did) driversInvolved.add(did);
              const rec=deliveryRecord(date,c.id);
              if(!rec || (rec.status!=='entregado' && rec.status!=='no_entregado')) return;
              if(rec.status==='entregado'){ rs.completed++; totalCompleted++; dailyDelivered[date]++; }
              else { rs.failed++; totalFailed++; }
              if(rec.at) marks.push({at:new Date(rec.at)});
              if(did){
                driverStats[did] ||= {completed:0, failed:0, routesWorked:new Set(), km:0, durations:[]};
                driverStats[did][rec.status==='entregado'?'completed':'failed']++;
                driverStats[did].routesWorked.add(date+'|'+r.id);
              }
            });
            driversInvolved.forEach(did=>(activeDriversByDate[date] ||= new Set()).add(did));
            if(marks.length>=2){
              marks.sort((a,b)=>a.at-b.at);
              const minutes=(marks[marks.length-1].at-marks[0].at)/60000;
              if(minutes>0 && minutes<20*60){
                rs.durations.push(minutes);
                routeDurations.push({date, routeId:r.id, routeName:r.name, minutes});
                driversInvolved.forEach(did=>driverStats[did]?.durations.push(minutes));
              }
              for(let i=1;i<marks.length;i++){ const gap=(marks[i].at-marks[i-1].at)/60000; if(gap>0 && gap<6*60) gapMinutes.push(gap); }
            }
            const withCoords=list
              .map(c=>({c, addr:resolvedAddress(c,date)}))
              .filter(t=>t.addr && t.addr.lat!=null && t.addr.lng!=null)
              .sort((a,b)=>(n(effectiveOrder(a.c,date))||9999)-(n(effectiveOrder(b.c,date))||9999));
            if(withCoords.length>=2){
              let km=null;
              if(useRoadKm && window.DriverMap?.fetchRoadRoute){
                try{
                  const road=await window.DriverMap.fetchRoadRoute(withCoords.map(t=>[t.addr.lat,t.addr.lng]));
                  if(road?.km){ km=road.km; await new Promise(r=>setTimeout(r,250)); }
                }catch(_){}
              }
              if(km==null){
                km=0;
                for(let i=1;i<withCoords.length;i++) km+=haversineKm(withCoords[i-1].addr.lat,withCoords[i-1].addr.lng,withCoords[i].addr.lat,withCoords[i].addr.lng);
              }
              rs.km+=km; rs.kmDays++;
              driversInvolved.forEach(did=>{ if(driverStats[did]) driverStats[did].km+=km/driversInvolved.size; });
            }
          }
        }
        const avg=arr=>arr.length?arr.reduce((a,v)=>a+v,0)/arr.length:0;
        const totalKm=Object.values(routeStats).reduce((a,r)=>a+r.km,0);
        const totalKmDays=Object.values(routeStats).reduce((a,r)=>a+r.kmDays,0);
        const costPerKm=n(state.settings.costPerKm);
        const activeDays=Object.keys(activeDriversByDate);
        const driverRanking=Object.entries(driverStats).map(([id,d])=>({
          id, name:driverName(id), completed:d.completed, failed:d.failed,
          successRate:(d.completed+d.failed)?d.completed/(d.completed+d.failed):0,
          avgMinutes:avg(d.durations), km:d.km, routesWorked:d.routesWorked.size
        })).sort((a,b)=>b.completed-a.completed);
        const routeRanking=Object.entries(routeStats).map(([id,r])=>({
          id, name:r.name, completed:r.completed, failed:r.failed, scheduled:r.scheduled,
          successRate:(r.completed+r.failed)?r.completed/(r.completed+r.failed):0,
          avgMinutes:avg(r.durations), avgKm:r.kmDays?r.km/r.kmDays:0, avgClients:avg(r.clientsPerDay)
        })).sort((a,b)=>b.completed-a.completed);
        const bySpeed=driverRanking.filter(d=>d.avgMinutes>0).sort((a,b)=>a.avgMinutes-b.avgMinutes);
        const weeks=[];
        dates.forEach((date,i)=>{ const wi=Math.floor(i/7); weeks[wi] ||= {label:`Semana ${wi+1}`, count:0, start:date}; weeks[wi].count+=dailyDelivered[date]||0; });
        return {
          dates, daysWithData: datesWithData.size, usedRoadKm: !!useRoadKm, totalScheduled, totalCompleted, totalFailed,
          successRate: (totalCompleted+totalFailed)?totalCompleted/(totalCompleted+totalFailed):0,
          pendingRate: totalScheduled?Math.max(0,totalScheduled-totalCompleted-totalFailed)/totalScheduled:0,
          avgRouteMinutes: avg(routeDurations.map(x=>x.minutes)),
          minRoute: routeDurations.length?routeDurations.reduce((a,b)=>a.minutes<b.minutes?a:b):null,
          maxRoute: routeDurations.length?routeDurations.reduce((a,b)=>a.minutes>b.minutes?a:b):null,
          avgGapMinutes: avg(gapMinutes),
          avgClientsPerRoute: avg(Object.values(routeStats).flatMap(r=>r.clientsPerDay)),
          totalKm, avgKmPerRouteDay: totalKmDays?totalKm/totalKmDays:0, costPerKm, estCost: totalKm*costPerKm,
          avgCostPerRoute: totalKmDays?(totalKm/totalKmDays)*costPerKm:0,
          avgActiveDriversPerDay: avg(activeDays.map(d=>activeDriversByDate[d].size)),
          driverRanking, routeRanking,
          fastestDriver: bySpeed[0]||null, slowestDriver: bySpeed.length?bySpeed[bySpeed.length-1]:null,
          weeklyTrend: weeks
        };
      }
      function metricsFilterBar(m){

        return `<div class="toolbar" style="flex-wrap:wrap">

        <div class="toolbar" style="flex-wrap:wrap">

          <label class="field" style="display:flex;align-items:center;gap:6px;width:auto;flex-direction:row"><input type="checkbox" id="metrics-road-km-toggle" ${ui.metrics.useRoadKm?'checked':''}> <span>Usar distancia real por calles (más lento)</span></label>
          ${ui.metrics.compare.enabled?`<label class="field">Comparar desde<div class="date-input-wrap"><input type="date" id="metrics-compare-start" value="${ui.metrics.compare.start}"></div></label><label class="field">Comparar hasta<div class="date-input-wrap"><input type="date" id="metrics-compare-end" value="${ui.metrics.compare.end}"></div></label><span class="muted" style="align-self:center;font-size:12px">Puedes comparar cualquier día, semana o mes contra otro (ej.: esta semana vs. la anterior, este mes vs. el mismo mes del año pasado).</span>`:''}
        </div>`;
      }
      function metricsKpiCards(m){
        const pct=x=>`${(x*100).toFixed(0)}%`;
        const mins=x=>x?`${Math.floor(x/60)}h ${Math.round(x%60)}m`:'—';
        const items=[
          ['Días con datos', m.daysWithData, `de ${m.dates.length} en el periodo`],
          ['Entregas completadas', m.totalCompleted, `de ${m.totalScheduled} programadas`],
          ['% Entregas fallidas', pct(m.totalScheduled?m.totalFailed/m.totalScheduled:0), ''],
          ['Ratio completadas vs pendientes', pct(m.successRate), `pendientes ${pct(m.pendingRate)}`],
          ['Tiempo promedio por ruta', mins(m.avgRouteMinutes), 'inicio → última entrega'],
          ['Tiempo de espera entre paradas', m.avgGapMinutes?`${Math.round(m.avgGapMinutes)} min`:'—', 'promedio'],
          ['Clientes promedio por ruta', m.avgClientsPerRoute.toFixed(1), ''],
          ['Km estimados (total periodo)', m.totalKm.toFixed(1), m.usedRoadKm?'por calles (OSRM)':'línea recta entre direcciones'],
          ['Km promedio por ruta/día', m.avgKmPerRouteDay.toFixed(1), ''],
          ['Costo estimado del periodo', m.costPerKm?`Bs ${m.estCost.toFixed(2)}`:'—', m.costPerKm?`Bs ${m.costPerKm}/km`:'define el costo por km arriba'],
          ['Costo promedio por ruta', m.costPerKm?`Bs ${m.avgCostPerRoute.toFixed(2)}`:'—', ''],
          ['Drivers activos promedio/día', m.avgActiveDriversPerDay.toFixed(1), '']
        ];
        return `<div class="summary-grid">${items.map(([label,val,sub])=>`<div class="card metric"><div class="muted" style="font-size:11px">${esc(label)}</div><strong>${val}</strong>${sub?`<small class="muted" style="display:block">${esc(sub)}</small>`:''}</div>`).join('')}</div>`;
      }
      function metricsTrendChart(m){
        const max=Math.max(1,...m.weeklyTrend.map(w=>w.count));
        const bars=m.weeklyTrend.map(w=>`<div class="metrics-bar-col"><div class="metrics-bar" style="height:${Math.round((w.count/max)*100)}%" title="${w.label}: ${w.count} entregas"></div><small class="muted">${w.label.replace('Semana ','S')}</small><b style="font-size:11px">${w.count}</b></div>`).join('');
        return `<div class="card card-pad"><h3 style="margin:0 0 10px;font-size:15px">Tendencia de entregas por semana</h3><div class="metrics-bar-row">${bars||'<p class="muted">Sin datos en el periodo.</p>'}</div></div>`;
      }
      function metricsExtremesCard(m){
        const fmt=r=>r?`${esc(r.routeName)} — ${r.date.split('-').reverse().join('/')} (${Math.floor(r.minutes/60)}h ${Math.round(r.minutes%60)}m)`:'—';
        return `<div class="card card-pad">
          <h3 style="margin:0 0 10px;font-size:15px">Ranking de drivers y extremos de ruta</h3>
          <p style="margin:2px 0"><b>Driver más rápido:</b> ${m.fastestDriver?`${esc(m.fastestDriver.name)} (${Math.round(m.fastestDriver.avgMinutes)} min/ruta prom.)`:'—'}</p>
          <p style="margin:2px 0"><b>Driver más lento:</b> ${m.slowestDriver?`${esc(m.slowestDriver.name)} (${Math.round(m.slowestDriver.avgMinutes)} min/ruta prom.)`:'—'}</p>
          <p style="margin:2px 0"><b>Ruta más rápida registrada:</b> ${fmt(m.minRoute)}</p>
          <p style="margin:2px 0"><b>Ruta más lenta registrada:</b> ${fmt(m.maxRoute)}</p>
        </div>`;
      }
      function heatColor(rate){
        if(rate>=0.9) return 'background:#dff7ed';
        if(rate>=0.7) return 'background:#fff2d9';
        return 'background:#ffe1e6';
      }
      function metricsDriverTable(m){
        const list=sort(m.driverRanking,'name','metrics-drivers');
        const headers=[['Driver','name'],['Completadas','completed'],['Fallidas','failed'],['% éxito','successRate'],['Tiempo prom./ruta','avgMinutes'],['Km estimados','km'],['Rutas trabajadas','routesWorked']];
        const rows=d=>`<tr><td><b>${esc(d.name)}</b></td><td>${d.completed}</td><td>${d.failed}</td><td style="${heatColor(d.successRate)}">${(d.successRate*100).toFixed(0)}%</td><td>${d.avgMinutes?Math.round(d.avgMinutes)+' min':'—'}</td><td>${d.km?d.km.toFixed(1):'—'}</td><td>${d.routesWorked}</td></tr>`;
        return table(list,headers,rows,'metrics-drivers');
      }
      function metricsRouteTable(m){
        const list=sort(m.routeRanking,'name','metrics-routes');
        const headers=[['Ruta','name'],['Programados','scheduled'],['Completados','completed'],['Fallidos','failed'],['% éxito','successRate'],['Tiempo prom.','avgMinutes'],['Km prom./día','avgKm'],['Clientes prom./día','avgClients']];
        const rows=r=>`<tr><td><b>${esc(r.name)}</b></td><td>${r.scheduled}</td><td>${r.completed}</td><td>${r.failed}</td><td style="${heatColor(r.successRate)}">${(r.successRate*100).toFixed(0)}%</td><td>${r.avgMinutes?Math.round(r.avgMinutes)+' min':'—'}</td><td>${r.avgKm?r.avgKm.toFixed(1):'—'}</td><td>${r.avgClients.toFixed(1)}</td></tr>`;
        return table(list,headers,rows,'metrics-routes');
      }
      function metricsComparisonCard(a,b){
        const pct=x=>`${(x*100).toFixed(0)}%`;
        const rows=[
          ['Entregas completadas', a.totalCompleted, b.totalCompleted],
          ['% éxito', pct(a.successRate), pct(b.successRate), a.successRate, b.successRate],
          ['Tiempo prom. por ruta (min)', Math.round(a.avgRouteMinutes), Math.round(b.avgRouteMinutes)],
          ['Km estimados (total)', a.totalKm.toFixed(1), b.totalKm.toFixed(1)],
          ['Costo estimado (Bs)', a.estCost.toFixed(2), b.estCost.toFixed(2)],
          ['Clientes prom. por ruta', a.avgClientsPerRoute.toFixed(1), b.avgClientsPerRoute.toFixed(1)]
        ];
        const delta=(av,bv,rawA,rawB)=>{
          const x=rawA!=null?rawA:Number(av), y=rawB!=null?rawB:Number(bv);
          if(isNaN(x)||isNaN(y)||!y) return '<span class="muted">—</span>';
          const d=((x-y)/y*100);
          if(Math.abs(d)<1) return '<span class="muted">≈ igual</span>';
          return d>0?`<span style="color:#087354">▲ ${d.toFixed(0)}%</span>`:`<span style="color:#a3123a">▼ ${Math.abs(d).toFixed(0)}%</span>`;
        };
        const trs=rows.map(([label,av,bv,rawA,rawB])=>`<tr><td>${esc(label)}</td><td>${av}</td><td>${bv}</td><td>${delta(av,bv,rawA,rawB)}</td></tr>`).join('');
        return `<div class="card card-pad" style="margin-bottom:16px"><h3 style="margin:0 0 6px;font-size:15px">Comparación de periodos</h3><p class="muted" style="margin:0 0 10px;font-size:12px">Actual: ${ui.metrics.start.split('-').reverse().join('/')} a ${ui.metrics.end.split('-').reverse().join('/')} · Comparado: ${ui.metrics.compare.start.split('-').reverse().join('/')} a ${ui.metrics.compare.end.split('-').reverse().join('/')}</p><div class="sheet table-responsive"><table class="table table-sm align-middle mb-0"><thead><tr><th>KPI</th><th>Periodo actual</th><th>Periodo comparado</th><th>Variación</th></tr></thead><tbody>${trs}</tbody></table></div></div>`;
      }
      let metricsLastComputed=null, metricsLastCompare=null, metricsLoaded=false, metricsStale=false;
      const REFRESH_ICON='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align:-2px;margin-right:4px"><path d="M23 4v6h-6"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>';
      async function renderMetrics(forceRefresh){
        if(!canAccessPage('metrics')) return;
        const el=$('#metrics-page');
        const subtitleBase='Estadísticas de reparto: tiempos, cumplimiento, kilómetros estimados y desempeño de drivers y rutas.';
        if(pageNeedsPremium('metrics')){ el.innerHTML=pageHead('Métricas',subtitleBase)+premiumLockHtml('Métricas'); return; }
        const actions=`<button class="refresh" data-action="refresh-metrics">${REFRESH_ICON}Actualizar</button>`;
        if(forceRefresh){
          el.innerHTML=pageHead('Métricas',subtitleBase,actions)+metricsFilterBar()+'<p class="muted">Calculando…</p>';
          bindMetricsFilters();
          const {start,end,routeId,driverId,compare,useRoadKm}=ui.metrics;
          const [m,mB]=await Promise.all([
            computeMetrics(start,end,routeId,driverId,useRoadKm),
            compare.enabled && compare.start && compare.end ? computeMetrics(compare.start,compare.end,routeId,driverId,useRoadKm) : Promise.resolve(null)
          ]);
          metricsLastComputed=m; metricsLastCompare=mB; metricsLoaded=true; metricsStale=false;
          if(ui.page!=='metrics') return; // el usuario navegó a otra página mientras calculaba
        }
        if(!metricsLoaded){
          el.innerHTML=pageHead('Métricas',subtitleBase,actions)+metricsFilterBar()+'<p class="muted">Ajusta los filtros si quieres y presiona Actualizar para calcular las métricas. No se consulta la base de datos hasta entonces.</p>';
          bindMetricsFilters();
          return;
        }
        const m=metricsLastComputed, mB=metricsLastCompare;
        const staleNote=metricsStale?'<p class="muted" style="color:var(--danger)">Cambiaste los filtros — estos números son del cálculo anterior. Presiona Actualizar para recalcular.</p>':'';
        el.innerHTML=pageHead('Métricas',subtitleBase,actions)+metricsFilterBar()+staleNote
          +metricsKpiCards(m)
          +(mB?metricsComparisonCard(m,mB):'')
          +`<div class="two-col metrics-split">${metricsTrendChart(m)}${metricsExtremesCard(m)}</div>`

iminado`,kind,label||id,id,{});}

      function buildDaySnapshotPayload(date,clientIds){
        const activeClients=clientIds?state.clients.filter(c=>clientIds.includes(c.id)):state.clients.filter(c=>status(c,date)==='Activo');
        const menuCols=menuItems();
        const rows=activeClients.map(c=>{
          const rid=effectiveRouteId(c,date);
          const pitems=c.items||plan(c.planId)?.items||{};
          const items={};
          menuCols.forEach(([key,label])=>{items[label]=n(pitems[key]);});
          return {
            id:c.id,
            orden:n(effectiveOrder(c,date)),
            nombre:c.name,
            ruta:rid?routeName(rid):'Sin ruta',
            driver:driverName(c.driverId),
            plan:planName(c.planId),
            direccion:effectiveAddress(c,date)||'',
            direccion2:(c.addresses||[]).map(a=>a.address).filter(a=>a&&a!==effectiveAddress(c,date)).join(' / '),
            maps:effectiveMaps(c,date)||'',
            telefono1:c.phone1||'',
            telefono2:c.phone2||'',
            bolsas:n(c.bags),
            items,
            dietaEspecial:c.specialDiet||'',
            observaciones:effectiveNotes(c,date)||'',
            carreras:n(c.career||1),
            estado:c.status,
            serviciosRestantes:n(c.paidDays)?Math.max(0,n(c.paidDays)-n(c.consumedDays)):0
          };
        });
        rows.sort((a,b)=>(a.ruta||'').localeCompare(b.ruta||'')||(a.orden||9999)-(b.orden||9999));
        const movimientosDelDia=state.inventory.movements.filter(m=>m.date===date&&m.type==='delivery').map(m=>({
          producto:kitchenItem(m.inventoryId)?.name||m.inventoryId,
          cantidadDescontada:-n(m.quantity),
          unidad:kitchenItem(m.inventoryId)?.unit||'',
          nota:m.note||''
        }));
        return {
          fecha:date,
          empresa:state.settings?.companyName||APP_CONFIG.companyName,
          totalClientes:rows.length,
          clientes:rows,
          inventarioDescontado:movimientosDelDia
        };
      }

      function processDay(){
        if(!canEditPage('dispatch')){notice('No tienes permiso para procesar el día.',true);return;}
        const d=day();
        if(d.processed){notice('Este día ya fue procesado.',true);return;}
        const processedDate=state.currentDate;
        if(!d.laborable){
          if(!confirm(`¿Cerrar el día ${processedDate.split('-').reverse().join('/')} como no laborable? No se procesan pedidos ni se descuenta inventario.`))return;
          d.processed=true;d.processedClientIds=[];d.payrollSnapshot=[];delete dispatchHistorialCache[processedDate];
          state.currentDate=nextDay(processedDate); day(state.currentDate);
          save();renderDispatch();
          notice(`Día no laborable cerrado. El día de trabajo pasó a ${state.currentDate.split('-').reverse().join('/')}.`);
          logAudit('Día cerrado (no laborable)','day',processedDate,processedDate,{});
          window.SupabaseDB?.dbUpsertSnapshot(processedDate,buildDaySnapshotPayload(processedDate,[]));
          return;
        }
        if(!confirm(`¿Procesar el día ${processedDate.split('-').reverse().join('/')}?`))return;
        const activeClients=state.clients.filter(c=>status(c)==='Activo');
        const processedIds=activeClients.map(c=>c.id);
        const payrollSnapshot=activeClients.map(c=>({id:c.id,career:n(c.career||1),driverId:effectiveDriverId(c,processedDate)}));
        activeClients.forEach(c=>{
          c.consumedDays=n(c.consumedDays)+1;
          if(c.pendingPlan && c.consumedDays>=n(c.pendingPlan.activateAtConsumedDays)){
            c.lastPlanTransition={date:state.currentDate,previousPlanId:c.planId,previousItems:c.items||{},pendingPlan:{...c.pendingPlan}};
            c.planId=c.pendingPlan.planId;
            c.items={};
            c.pendingPlan=null;
          }
        });
        applyInventoryForProcessedDay(processedDate);
        d.processed=true;d.processedClientIds=processedIds;d.payrollSnapshot=payrollSnapshot;delete dispatchHistorialCache[processedDate];
        state.currentDate=nextDay(processedDate); day(state.currentDate);
        save();renderDispatch();notice(`Día procesado e inventario actualizado. El día de trabajo pasó a ${state.currentDate.split('-').reverse().join('/')}. Descargando constancia (Excel) y respaldo (JSON)…`);
        logAudit('Día procesado','day',processedDate,processedDate,{clientesAtendidos:processedIds.length});
        window.SupabaseDB?.dbUpsertSnapshot(processedDate,buildDaySnapshotPayload(processedDate,processedIds));
        exportProcessedDaySnapshot(processedDate,processedIds);
        setTimeout(()=>downloadStateJsonBackup(`dia-procesado-${processedDate}`),700);
      }

      function unprocessDay(){
        if(!canEditPage('dispatch')){notice('No tienes permiso para desprocesar el día.',true);return;}
        const d=day();
        if(!d.processed){notice('Este día no está procesado.',true);return;}
        if(!confirm(`¿Desprocesar el día ${state.currentDate.split('-').reverse().join('/')}? Se revertirá el descuento de inventario, el conteo de días consumidos, y cualquier cambio de plan automático que se haya disparado justo ese día (puedes volver a procesarlo después).`))return;
        const ids=d.processedClientIds||state.clients.filter(c=>status(c)==='Activo').map(c=>c.id);
        state.clients.filter(c=>ids.includes(c.id)).forEach(c=>{
          c.consumedDays=Math.max(0,n(c.consumedDays)-1);
          if(c.lastPlanTransition && c.lastPlanTransition.date===state.currentDate){
            c.planId=c.lastPlanTransition.previousPlanId;
            c.items=c.lastPlanTransition.previousItems;
            c.pendingPlan=c.lastPlanTransition.pendingPlan;
            delete c.lastPlanTransition;
          }
        });
        revertInventoryForProcessedDay(state.currentDate);
        d.processed=false;d.processedClientIds=[];d.payrollSnapshot=[];delete dispatchHistorialCache[state.currentDate];save();renderDispatch();notice('Día desprocesado. El inventario y los días consumidos fueron restaurados.');
        logAudit('Día desprocesado','day',state.currentDate,state.currentDate,{});
      }
      function toggleDayPause(id){

        save(); renderDispatch();
      }

          });
          lastClientLatlngs=sorted.filter(({c}) => !!n(effectiveOrder(c,date))).map(({addr}) => [addr.lat,addr.lng]);
          const pendingCount=sorted.length-lastClientLatlngs.length;
          drawStraightFallback(`Números = orden del cliente. Naranja con "P" = todavía sin número asignado (no participa en la ruta).${pendingCount?` ${pendingCount} cliente(s) pendiente(s) de orden.`:''} Presioná "↻ Ruta" para calcular la ruta real por calles.${withoutCoords?` ${withoutCoords} cliente(s) sin ubicación resuelta.`:''}`);
          drawDriverConnector();
          if (latlngs.length) map.fitBounds(window.L.latLngBounds(latlngs).pad(0.2)); else map.setView([-16.5,-68.15],12);
          setStatus(withCoords.length ? `${withCoords.length}/${list.length} puntos en el mapa.` : 'No se pudo ubicar a ningún cliente en el mapa todavía.');
          setTimeout(() => map && map.invalidateSize(), 50);
        }

        function ensureLocationChannel(){
          const client=window.SupabaseDB?.client;
          if (!client || locationChannel) return locationChannel;
          locationChannel=client.channel(LOCATION_CHANNEL_NAME);
          return locationChannel;
        }

        function startListening(routeId){
          const channel=ensureLocationChannel();
          if (!channel) return;
          if (!channelBound){
            channel.on('broadcast', { event: 'loc' }, ({ payload }) => {
              if (!payload) return;
              const matches = Array.isArray(payload.routeIds) ? payload.routeIds.includes(currentRouteId) : payload.routeId === currentRouteId;
              if (!matches) return;
              drawDriverMarker(payload.lat, payload.lng, payload.name || 'Driver');
            });
            channel.subscribe();
            channelBound=true;
          }
        }

        function startBroadcast(routeIds, name){
          const channel=ensureLocationChannel();
          if (!channel || !navigator.geolocation) return;
          channel.subscribe();
          watchId=navigator.geolocation.watchPosition(pos => {
            const now=Date.now();
            drawDriverMarker(pos.coords.latitude, pos.coords.longitude, name || 'Tú');
            if (now - lastBroadcastAt < BROADCAST_MIN_INTERVAL_MS) return;
            lastBroadcastAt=now;
            channel.send({ type:'broadcast', event:'loc', payload:{ routeId:routeIds[0], routeIds, lat:pos.coords.latitude, lng:pos.coords.longitude, name, at:now } });
          }, err => {
            setStatus(err.code===1 ? 'Activa el permiso de ubicación para compartir tu posición en vivo.' : 'No se pudo obtener tu ubicación en vivo.');
          }, { enableHighAccuracy:true, maximumAge:4000, timeout:15000 });
        }

        function drawDriverMarker(lat,lng,name){
          if (!map || !window.L) return;
          driverPos={lat,lng};
          const icon=window.L.divIcon({ className:'', html:'<div class="mc-driver-icon">🚚</div>', iconSize:[34,34], iconAnchor:[17,17] });
          if (!driverMarker) driverMarker=window.L.marker([lat,lng], { icon, zIndexOffset:1000 }).addTo(map).bindPopup(escapeHtml(name));
          else driverMarker.setLatLng([lat,lng]);
          drawDriverConnector();
        }

        function teardown(){
          if (watchId!=null && navigator.geolocation){ navigator.geolocation.clearWatch(watchId); watchId=null; }
          if (map){ map.remove(); map=null; }
          driverMarker=null; markersLayer=null; routeLayer=null; driverConnectorLayer=null; driverPos=null; lastClientLatlngs=[];
          lastRoadKey=null; lastRoadResult=null;
        }

        function populateRouteSelector(activeRouteId){
          routeSelectWrap.hidden=false;
          const date=workDate();
          routeSelectWrap.innerHTML=`<select id="mmap-route-select">${state.routes.map(r => {
            const hasClients=deliveryListFor(r.id, date).length>0;
            return `<option value="${r.id}" ${r.id===activeRouteId?'selected':''} ${hasClients?'':'disabled'}>${escapeHtml(r.name)}${hasClients?'':' (sin clientes hoy)'}</option>`;
          }).join('')}</select>`;
          routeSelectWrap.querySelector('select').addEventListener('change', e => {
            if (e.target.selectedOptions[0]?.disabled) return; // por si el navegador deja seleccionar una opción disabled
            loadAndRender(e.target.value);
          });
        }

        function firstRouteWithData(){
          for (const r of state.routes) if (deliveryListFor(r.id, workDate()).length) return r.id;
          return '';
        }

        async function loadAndRender(routeIdOrIds){
          const asDriver=isDriverRole();
          currentRouteId=Array.isArray(routeIdOrIds)?routeIdOrIds[0]:routeIdOrIds;
          const routeIds=Array.isArray(routeIdOrIds)?routeIdOrIds:[routeIdOrIds];
          setStatus('Cargando lista de entregas…');
          const date=workDate();
          await ensureDeliveryLoaded(date);
          const fullList=deliveryListFor(asDriver?routeIds:currentRouteId, date);
          const list=fullList.filter(c => (deliveryRecord(date, c.id)?.status || 'pendiente') === 'pendiente');
          if (!list.length){
            if (map){ map.remove(); map=null; }
            mapBodyEl.innerHTML=''; legendEl.textContent='';
            setStatus(fullList.length ? 'Ya se marcaron todos los pedidos (entregados o no entregados).' : 'No hay pedidos activos para hoy.');
            return;
          }
          renderMapView(list, date);
          await resolveCoords(list, date);
          renderMapView(list, date);
          if (asDriver) startBroadcast(routeIds, activeUser?.name);
          else startListening(currentRouteId);
        }

        async function open(routeIdParam){
          if (!canAccessPage('delivery')) return;
          ensureStyles(); buildDialog();
          setStatus('Cargando mapa…');
          dialog.showModal();
          if(!await ensureLeaflet()){ setStatus('No se pudo cargar el mapa (sin conexión a internet).'); return; }
          setTimeout(() => map && map.invalidateSize(), 30);
          if (isDriverRole()){
            if (routeSelectWrap) routeSelectWrap.hidden=true;
            const routeIds=(routeIdParam?String(routeIdParam).split(',').filter(Boolean):null) || myRouteIds();
            await loadAndRender(routeIds);
          } else {
            const target=routeIdParam || firstRouteWithData();
            populateRouteSelector(target);
            await loadAndRender(target);
          }
        }

        window.DriverMap={ open, fetchRoadRoute };
      })();
    })();
});
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous" defer></script>
